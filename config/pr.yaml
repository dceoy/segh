version: 1
organization: dceoy
github:
  web_url: https://github.com
  api_url: https://api.github.com
  graphql_url: https://api.github.com/graphql
auth:
  app_id: 0
  installation_id: 0
  private_key_env: SEGH_GITHUB_APP_PRIVATE_KEY
  token_env: SEGH_GITHUB_TOKEN
  allow_existing_token: false
selectors:
  exclude_archived: true
  exclude_disabled: true
  exclude_forks: false
policies:
  actions:
    default_workflow_permissions: read
    require_full_sha: true
  code_security: {}
  repository: {}
suppressions: []
scanners:
  zizmor:
    enabled: true
    version: 1.28.0
    timeout: 5m
    cpu_seconds: 300
    memory_mb: 2048
  trivy:
    enabled: true
    version: 0.72.0
    timeout: 10m
    cpu_seconds: 600
    memory_mb: 3072
  scorecard:
    enabled: false
    version: 5.5.0
  semgrep:
    enabled: false
    version: 1.171.0
    rules: []
execution:
  concurrency: 2
  repository_timeout: 15m
  total_timeout: 30m
  api_timeout: 30s
  max_retries: 3
  base_retry_delay: 1s
  dry_run: false
publication:
  enabled: false
  poll_timeout: 2m
  category_prefix: segh-pr
output:
  directory: segh-results
  jsonl: true
  retention_days: 14
pull_request:
  report_only: true
  thresholds:
    default:
      minimum_severity: high
      rules: []
