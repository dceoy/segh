---
# Keep Checkov limited to infrastructure-as-code frameworks. In particular,
# GitHub Actions, SCA, image, secret, and SAST scanning belong to other gates.
framework:
  - ansible
  - argo_workflows
  - arm
  - bicep
  - cloudformation
  - dockerfile
  - helm
  - json
  - kubernetes
  - kustomize
  - openapi
  - serverless
  - terraform
  - terraform_json
  - terraform_plan
  - yaml

# The pinned Checkov release and this centrally reviewed exclusion list define
# the deterministic policy baseline. Add accepted Checkov IDs here only after
# review; target-repository configuration is never loaded.
skip-check: []

compact: true
download-external-modules: false
evaluate-variables: false
skip-download: true
skip-results-upload: true
