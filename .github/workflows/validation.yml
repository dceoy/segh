---
name: Validation

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install checksum-verified tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Validate credential boundaries
        run: ruby scripts/test-workflow-security.rb
      - name: Run actionlint
        run: |
          actionlint \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue.*SC2129' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml
      - name: Run zizmor
        run: >-
          zizmor --offline --no-config
          --min-severity high --min-confidence high
          .github/workflows
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate YAML and JSON
        run: |
          ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path) }'
          ruby -e 'require "json"; JSON.parse(File.read("aqua-checksums.json"))'
      - name: Verify Aqua checksums
        run: aqua i

  workflow-only-boundary:
    name: Workflow-only boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject removed product surfaces
        shell: bash
        run: |
          set -euo pipefail

          lint_config_path=.golang""ci.yml
          forbidden_paths=(
            cmd
            internal
            schema
            config
            go.mod
            go.sum
            go.work
            go.work.sum
            "$lint_config_path"
            segh.example.yaml
            Makefile
          )
          for path in "${forbidden_paths[@]}"; do
            if git ls-files -- "$path" "$path/**" | grep -q .; then
              echo "::error::Removed product path is tracked again: $path"
              exit 1
            fi
          done
          if git ls-files -- '*.go' | grep -q .; then
            echo "::error::Go source files are not part of the workflow-only product."
            exit 1
          fi

          mapfile -d '' -t action_files < <(
            git ls-files -z -- \
              '.github/workflows/*.yml' \
              '.github/workflows/*.yaml' \
              ':(glob)**/action.yml' \
              ':(glob)**/action.yaml'
          )
          ruby -ryaml -e '
            tracked_files = IO.popen(["git", "ls-files", "-z"], &:read).split("\0")
            action_files = ARGV
            forbidden_literals = [
              ["dceoy/gha-for-", "devops"].join,
              ["golang", "ci"].join,
              ["inventory.", "json"].join,
              ["audit.", "json"].join,
              ["scan-manifest.", "json"].join,
              ["scan-summary.", "json"].join,
              ["scan-report.", "md"].join,
              ["reconcile-source-", "scan"].join,
              ["status.", "json"].join
            ]
            package_declaration = /(^|\s)pack#{"age"}\s/
            go_command = /(?:^|[;&|()\s])(?:["\x27]?(?:\$\(\s*(?:command\s+-v|which)\s+go\s*\)|[^\s;&|()"\x27`]*\/go|go)["\x27]?)\s+(?:test|build|vet|install|run|generate|fmt|env|list|mod|work|tool|version)(?:\s|$)/

            tracked_files.each do |path|
              content = File.binread(path)
              next if content.include?("\0")

              forbidden_literals.each do |literal|
                if content.include?(literal)
                  warn "::error file=#{path}::Removed product surface reappeared: #{literal}"
                  exit 1
                end
              end
              if content.match?(package_declaration)
                warn "::error file=#{path}::Go source declarations are not part of the workflow-only product."
                exit 1
              end
              if content.match?(go_command)
                warn "::error file=#{path}::Go toolchain commands are not part of the workflow-only product."
                exit 1
              end
            end

            expected_permissions = {
              "issues" => "write",
              "contents" => "read",
              "actions" => "read"
            }
            validate_permissions = lambda do |permissions, path, scope, publisher|
              return if permissions.nil? || permissions == {}

              unless permissions.is_a?(Hash)
                if permissions == "write-all"
                  warn "::error file=#{path}::#{scope} must not request write-all permissions."
                  exit 1
                end
                next
              end

              if publisher
                unless permissions["issues"] == "write" &&
                       permissions.all? { |name, access| expected_permissions[name] == access }
                  warn "::error file=#{path}::publish-dashboard permissions exceed the isolated publisher contract."
                  exit 1
                end
              elsif permissions.any? { |_, access| access == "write" }
                warn "::error file=#{path}::#{scope} must not request write permissions."
                exit 1
              end
            end

            validate_action = lambda do |action, path|
              unless action.is_a?(String)
                warn "::error file=#{path}::Action reference must be a string."
                exit 1
              end
              return if action.start_with?("./")

              name = action.sub(/@[^@]+\z/, "")
              if name == "actions/setup-go"
                warn "::error file=#{path}::The Go toolchain action is not part of the workflow-only product: #{action}"
                exit 1
              end
              unless action.match?(/\A[^@\s]+@[0-9a-f]{40}\z/)
                warn "::error file=#{path}::Remote action is not pinned to a full commit SHA: #{action}"
                exit 1
              end
            end

            validate_step = lambda do |step, path|
              validate_action.call(step["uses"], path) if step.key?("uses")
            end

            action_files.each do |path|
              document = YAML.load_file(path)
              if path.start_with?(".github/workflows/")
                validate_permissions.call(document["permissions"], path, "workflow", false)
                document.fetch("jobs", {}).each do |job_name, job|
                  publisher = path == ".github/workflows/organization-scan.yml" &&
                              job_name == "publish-dashboard"
                  validate_permissions.call(job["permissions"], path, "job #{job_name}", publisher)
                  validate_action.call(job["uses"], path) if job.key?("uses")
                  Array(job["steps"]).each { |step| validate_step.call(step, path) }
                end
              else
                Array(document.dig("runs", "steps")).each { |step| validate_step.call(step, path) }
              end
            end
          ' "${action_files[@]}"

          expected_scanners=(
            ossf/scorecard
            zizmorcore/zizmor
            rhysd/actionlint
            koalaman/shellcheck
            aquasecurity/trivy
          )
          mapfile -t actual_scanners < <(
            ruby -ryaml -e '
              YAML.load_file("aqua.yaml").fetch("packages").each do |package|
                puts package.fetch("name").sub(/@[^@]+\z/, "")
              end
            '
          )
          if ((${#actual_scanners[@]} != ${#expected_scanners[@]})); then
            echo "::error::The trusted Aqua profile must contain exactly five scanners."
            exit 1
          fi
          for index in "${!expected_scanners[@]}"; do
            if [[ "${actual_scanners[$index]}" != "${expected_scanners[$index]}" ]]; then
              echo "::error::Unexpected scanner at position $index: ${actual_scanners[$index]}"
              exit 1
            fi
          done

  production-workflow:
    needs: workflow-only-boundary
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      validation_mode: true
      repository_limit: "50"
      max_parallel: "5"
