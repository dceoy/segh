---
name: Validation

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install checksum-verified tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Validate credential boundaries
        run: ruby scripts/test-workflow-security.rb
      - name: Run actionlint
        run: |
          actionlint \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue.*SC2129' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml
      - name: Run zizmor
        run: >-
          zizmor --offline --no-config
          --min-severity high --min-confidence high
          .github/workflows
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate YAML and JSON
        run: |
          ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path) }'
          ruby -e 'require "json"; JSON.parse(File.read("aqua-checksums.json"))'
      - name: Verify Aqua checksums
        run: aqua i

  workflow-only-boundary:
    name: Workflow-only boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject removed product surfaces
        shell: bash
        run: |
          set -euo pipefail

          expected_paths=(
            .github/workflows/organization-scan.yml
            .github/workflows/validation.yml
            CREDENTIALS.md
            LICENSE
            README.md
            SECURITY.md
            aqua-checksums.json
            aqua.yaml
            scripts/preflight.sh
            scripts/test-workflow-security.rb
          )
          mapfile -d '' -t actual_paths < <(git ls-files -z)
          if ((${#actual_paths[@]} != ${#expected_paths[@]})); then
            echo "::error::Tracked path set differs from the workflow-only product allowlist."
            printf 'Expected paths:\n'
            printf '  %s\n' "${expected_paths[@]}"
            printf 'Actual paths:\n'
            printf '  %s\n' "${actual_paths[@]}"
            exit 1
          fi
          for index in "${!expected_paths[@]}"; do
            if [[ "${actual_paths[$index]}" != "${expected_paths[$index]}" ]]; then
              echo "::error::Unexpected tracked path at position $index: ${actual_paths[$index]}"
              exit 1
            fi
          done

          mapfile -d '' -t action_files < <(
            git ls-files -z -- \
              '.github/workflows/*.yml' \
              '.github/workflows/*.yaml' \
              ':(glob)**/action.yml' \
              ':(glob)**/action.yaml'
          )
          ruby -ryaml -e '
            tracked_files = IO.popen(["git", "ls-files", "-z"], &:read).split("\0")
            action_files = ARGV
            documents = action_files.to_h { |path| [path, YAML.load_file(path)] }
            forbidden_literals = [
              ["dceoy/gha-for-", "devops"].join,
              ["golang", "ci"].join,
              ["inventory.", "json"].join,
              ["audit.", "json"].join,
              ["scan-manifest.", "json"].join,
              ["scan-summary.", "json"].join,
              ["scan-report.", "md"].join,
              ["reconcile-source-", "scan"].join,
              ["status.", "json"].join
            ]
            go_command = /(?:^|[;&|()\s])(?:["\x27]?(?:\$\(\s*(?:command\s+-v|which)\s+go\s*\)|[^\s;&|()"\x27`]*\/go|go)["\x27]?)\s+(?:test|build|vet|install|run|generate|fmt|env|list|mod|work|tool|version)(?:\s|$)/

            tracked_files.each do |path|
              content = File.binread(path)
              next if content.include?("\0")

              forbidden_literals.each do |literal|
                if content.include?(literal)
                  warn "::error file=#{path}::Removed product surface reappeared: #{literal}"
                  exit 1
                end
              end
            end

            executable_surfaces = Dir["scripts/*"].select { |path| File.file?(path) }
            documents.each do |path, document|
              runs = []
              collect_runs = lambda do |node|
                case node
                when Hash
                  node.each do |key, value|
                    runs << value if key == "run" && value.is_a?(String)
                    collect_runs.call(value)
                  end
                when Array
                  node.each { |value| collect_runs.call(value) }
                end
              end
              collect_runs.call(document)
              runs.each_with_index do |run, index|
                if run.match?(go_command)
                  warn "::error file=#{path}::Executable run block #{index + 1} invokes the removed Go toolchain."
                  exit 1
                end
              end
            end
            executable_surfaces.each do |path|
              content = File.binread(path)
              next if content.include?("\0")
              if content.match?(go_command)
                warn "::error file=#{path}::Executable script invokes the removed Go toolchain."
                exit 1
              end
            end

            expected_permissions = {
              "issues" => "write",
              "contents" => "read",
              "actions" => "read"
            }
            validate_permissions = lambda do |permissions, path, scope, publisher|
              return if permissions.nil? || permissions == {}

              unless permissions.is_a?(Hash)
                if permissions == "write-all"
                  warn "::error file=#{path}::#{scope} must not request write-all permissions."
                  exit 1
                end
                next
              end

              if publisher
                unless permissions["issues"] == "write" &&
                       permissions.all? { |name, access| expected_permissions[name] == access }
                  warn "::error file=#{path}::publish-dashboard permissions exceed the isolated publisher contract."
                  exit 1
                end
              elsif permissions.any? { |_, access| access == "write" }
                warn "::error file=#{path}::#{scope} must not request write permissions."
                exit 1
              end
            end

            validate_action = lambda do |action, path|
              unless action.is_a?(String)
                warn "::error file=#{path}::Action reference must be a string."
                exit 1
              end
              return if action.start_with?("./")

              name = action.sub(/@[^@]+\z/, "")
              if name == "actions/setup-go"
                warn "::error file=#{path}::The Go toolchain action is not part of the workflow-only product: #{action}"
                exit 1
              end
              unless action.match?(/\A[^@\s]+@[0-9a-f]{40}\z/)
                warn "::error file=#{path}::Remote action is not pinned to a full commit SHA: #{action}"
                exit 1
              end
            end

            validate_step = lambda do |step, path|
              validate_action.call(step["uses"], path) if step.key?("uses")
            end

            documents.each do |path, document|
              if path.start_with?(".github/workflows/")
                validate_permissions.call(document["permissions"], path, "workflow", false)
                document.fetch("jobs", {}).each do |job_name, job|
                  publisher = path == ".github/workflows/organization-scan.yml" &&
                              job_name == "publish-dashboard"
                  validate_permissions.call(job["permissions"], path, "job #{job_name}", publisher)
                  validate_action.call(job["uses"], path) if job.key?("uses")
                  Array(job["steps"]).each { |step| validate_step.call(step, path) }
                end
              else
                Array(document.dig("runs", "steps")).each { |step| validate_step.call(step, path) }
              end
            end

            organization_path = ".github/workflows/organization-scan.yml"
            organization = documents.fetch(organization_path)
            jobs = organization.fetch("jobs")
            plan_steps = Array(jobs.fetch("plan")["steps"])
            scan_steps = Array(jobs.fetch("scan")["steps"])
            targets = plan_steps.find { |step| step["id"] == "targets" }
            unless targets && targets["run"].is_a?(String)
              warn "::error file=#{organization_path}::The immutable target-planning step is missing."
              exit 1
            end

            gh_api_calls = []
            jobs.each do |job_name, job|
              Array(job["steps"]).each do |step|
                run = step["run"]
                gh_api_calls << [job_name, step["id"], run] if run.is_a?(String) && run.match?(/\bgh\s+api\b/)
              end
            end
            unless gh_api_calls.length == 1 && gh_api_calls[0][0, 2] == ["plan", "targets"]
              warn "::error file=#{organization_path}::Only plan/targets may call gh api."
              exit 1
            end

            targets_run = targets["run"].dup
            allowed_calls = [
              /gh\s+api\s+--paginate\s+--slurp\s+\/installation\/repositories/,
              /gh\s+api\s+--method\s+GET\s+"repos\/\$full_name\/commits"\s*\\\s*-f\s+sha="\$default_branch"\s+-f\s+per_page=1/m
            ]
            allowed_calls.each do |pattern|
              unless targets_run.sub!(pattern, "")
                warn "::error file=#{organization_path}::The target planner must retain only the approved GitHub API calls."
                exit 1
              end
            end
            if targets_run.match?(/\bgh\s+api\b/)
              warn "::error file=#{organization_path}::An unapproved GitHub API call was added to the target planner."
              exit 1
            end

            target_token = "${{ inputs.validation_mode && github.token || steps.target-token.outputs.token }}"
            checkout = scan_steps.find { |step| step["id"] == "checkout" }
            scorecard = scan_steps.find { |step| step["id"] == "scorecard" }
            unless checkout&.dig("with", "token") == target_token &&
                   scorecard&.dig("env", "SEGH_TARGET_SCORECARD_TOKEN") == target_token
              warn "::error file=#{organization_path}::Target credentials must remain limited to checkout and Scorecard."
              exit 1
            end
            token_reference_count = 0
            count_token_references = lambda do |node|
              case node
              when Hash
                node.each_value { |value| count_token_references.call(value) }
              when Array
                node.each { |value| count_token_references.call(value) }
              when String
                token_reference_count += node.scan("steps.target-token.outputs.token").length
              end
            end
            count_token_references.call(organization)
            unless token_reference_count == 2
              warn "::error file=#{organization_path}::Additional target-token consumers are not allowed."
              exit 1
            end

            allowed_results = %w[
              results/actionlint.jsonl
              results/actionlint.log
              results/preflight.txt
              results/scanner-versions.log
              results/scanner-versions.txt
              results/scorecard-permissions.json
              results/scorecard-status.txt
              results/scorecard.json
              results/scorecard.log
              results/shellcheck-status.txt
              results/shellcheck.json
              results/shellcheck.log
              results/target.json
              results/trivy-misconfiguration.json
              results/trivy-misconfiguration.log
              results/trivy-secret.json
              results/trivy-secret.log
              results/trivy-vulnerability.json
              results/trivy-vulnerability.log
              results/zizmor.json
              results/zizmor.log
            ]
            organization_source = File.read(organization_path)
            remaining_result_paths = organization_source.dup
            allowed_results.each { |path| remaining_result_paths.gsub!(path, "") }
            if remaining_result_paths.include?("results/")
              warn "::error file=#{organization_path}::An unapproved or dynamic result artifact path was added."
              exit 1
            end
          ' "${action_files[@]}"

          ruby -ryaml -e '
            require "rubygems"

            minimum_scanners = {
              "ossf/scorecard" => "5.5.0",
              "zizmorcore/zizmor" => "1.28.0",
              "rhysd/actionlint" => "1.7.12",
              "koalaman/shellcheck" => "0.11.0",
              "aquasecurity/trivy" => "0.72.0"
            }
            version_pattern = /\Av?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\z/
            parse_version = lambda do |value|
              match = value.is_a?(String) && version_pattern.match(value)
              match && Gem::Version.new(match[1])
            end
            aqua = YAML.load_file("aqua.yaml")

            checksum = aqua.fetch("checksum", {})
            unless checksum["enabled"] == true && checksum["require_checksum"] == true
              warn "::error file=aqua.yaml::Aqua checksums must remain enabled and required."
              exit 1
            end

            registries = aqua.fetch("registries", [])
            registry = registries[0] if registries.is_a?(Array) && registries.length == 1
            registry_version = parse_version.call(registry["ref"]) if registry.is_a?(Hash)
            unless registry.is_a?(Hash) &&
                   registry["type"] == "standard" &&
                   registry_version &&
                   registry_version >= Gem::Version.new("4.544.0")
              warn "::error file=aqua.yaml::The Aqua standard registry must use one explicit non-downgraded semantic-version ref."
              exit 1
            end

            packages = aqua.fetch("packages", [])
            unless packages.is_a?(Array) && packages.length == minimum_scanners.length
              warn "::error file=aqua.yaml::The trusted Aqua profile must contain exactly five scanners."
              exit 1
            end

            minimum_scanners.each_with_index do |(expected, minimum), index|
              package = packages[index]
              name = package.is_a?(Hash) ? package["name"] : nil
              unless name.is_a?(String)
                warn "::error file=aqua.yaml::Scanner entry #{index} must contain a string name."
                exit 1
              end

              scanner, separator, package_version = name.rpartition("@")
              actual_version = parse_version.call(package_version)
              unless separator == "@" &&
                     scanner == expected &&
                     actual_version &&
                     actual_version >= Gem::Version.new(minimum)
                warn "::error file=aqua.yaml::Scanner #{index} must be #{expected} at an explicit non-downgraded semantic version."
                exit 1
              end
            end
          '

  production-workflow:
    needs: workflow-only-boundary
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      validation_mode: true
      repository_limit: "50"
      max_parallel: "5"
