---
name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@main # zizmor: ignore[unpinned-uses]
    with:
      search-path: .

  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install checksum-verified tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          sha256: 66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289
          install_args: --locked
      - name: Validate workflow credential boundary
        run: bash scripts/validate-workflow-boundary.sh .
      - name: Test target preflight boundary
        run: bash tests/test-preflight.sh
      - name: Test dashboard normalization and publication
        run: node --test tests/test-dashboard.js
      - name: Run actionlint
        run: |
          actionlint \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue.*SC2129' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml
      - name: Run zizmor
        run: >-
          zizmor --offline --no-config
          --min-severity high --min-confidence high
          .github/workflows
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Validate YAML
        run: |
          find . -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            while IFS= read -r -d '' path; do yq -e 'true' "$path" > /dev/null; done

  production-workflow:
    if: github.event_name == 'pull_request'
    needs: static
    permissions:
      actions: read
      contents: read
      checks: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      validation_mode: true
      repository_limit: "50"
      max_parallel: "4"

  github-codeql-analysis:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/github-codeql-analysis.yml@main # zizmor: ignore[unpinned-uses]
    with:
      language: >
        ["actions", "javascript-typescript"]

  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - markdown-lint
      - static
      - production-workflow
      - github-codeql-analysis
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true
