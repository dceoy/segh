---
name: Validation

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install checksum-verified tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Validate credential boundaries
        run: ruby scripts/test-workflow-security.rb
      - name: Run actionlint
        run: |
          actionlint \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue.*SC2129' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml
      - name: Run zizmor
        run: >-
          zizmor --offline --no-config
          --min-severity high --min-confidence high
          .github/workflows
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate YAML and JSON
        run: |
          ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path) }'
          ruby -e 'require "json"; JSON.parse(File.read("aqua-checksums.json"))'
      - name: Verify Aqua checksums
        run: aqua i

  workflow-only-boundary:
    name: Workflow-only boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject removed product surfaces
        shell: bash
        run: |
          set -euo pipefail

          expected_paths=(
            .github/workflows/organization-scan.yml
            .github/workflows/validation.yml
            CREDENTIALS.md
            LICENSE
            README.md
            SECURITY.md
            aqua-checksums.json
            aqua.yaml
            scripts/preflight.sh
            scripts/test-workflow-security.rb
          )
          mapfile -d '' -t actual_paths < <(git ls-files -z)
          if ((${#actual_paths[@]} != ${#expected_paths[@]})); then
            echo "::error::Tracked path set differs from the workflow-only product allowlist."
            printf 'Expected paths:\n'
            printf '  %s\n' "${expected_paths[@]}"
            printf 'Actual paths:\n'
            printf '  %s\n' "${actual_paths[@]}"
            exit 1
          fi
          for index in "${!expected_paths[@]}"; do
            if [[ "${actual_paths[$index]}" != "${expected_paths[$index]}" ]]; then
              echo "::error::Unexpected tracked path at position $index: ${actual_paths[$index]}"
              exit 1
            fi
          done

          mapfile -d '' -t action_files < <(
            git ls-files -z -- \
              '.github/workflows/*.yml' \
              '.github/workflows/*.yaml' \
              ':(glob)**/action.yml' \
              ':(glob)**/action.yaml'
          )
          ruby -ryaml - "${action_files[@]}" <<'RUBY'
          tracked_files = IO.popen(["git", "ls-files", "-z"], &:read).split("\0")
          action_files = ARGV
          documents = action_files.to_h { |path| [path, YAML.load_file(path)] }

          fail_boundary = lambda do |path, message|
            warn "::error file=#{path}::#{message}"
            exit 1
          end

          walk_strings = lambda do |node, path = [], &block|
            case node
            when Hash
              node.each { |key, value| walk_strings.call(value, path + [key], &block) }
            when Array
              node.each_with_index { |value, index| walk_strings.call(value, path + [index], &block) }
            when String
              block.call(path, node)
            end
          end

          forbidden_literals = [
            ["dceoy/gha-for-", "devops"].join,
            ["golang", "ci"].join,
            ["inventory.", "json"].join,
            ["audit.", "json"].join,
            ["scan-manifest.", "json"].join,
            ["scan-summary.", "json"].join,
            ["scan-report.", "md"].join,
            ["reconcile-source-", "scan"].join,
            ["status.", "json"].join
          ]
          go_command = /(?:^|[;&|()\s])(?:["\x27]?(?:\$\(\s*(?:command\s+-v|which)\s+go\s*\)|[^\s;&|()"\x27`]*\/go|go)["\x27]?)\s+(?:test|build|vet|install|run|generate|fmt|env|list|mod|work|tool|version)(?:\s|$)/
          alternate_network_client = %r{
            (?:
              \b(?:curl|wget|aria2c|httpie|xh|nc|ncat|netcat|socat)\b |
              \bopenssl\s+s_client\b |
              \bgit\s+(?:clone|fetch|pull|ls-remote)\b |
              \bNet::HTTP\b | \bnet/http\b | \bOpenURI\b | \bURI\.(?:open|parse)\b |
              \b(?:requests|urllib3?|httpx|aiohttp)\b |
              \b(?:axios|node-fetch)\b | \bfetch\s*\( |
              https?://(?:api\.)?github\.com | \bapi\.github\.com\b
            )
          }x

          tracked_files.each do |path|
            content = File.binread(path)
            next if content.include?("\0")

            forbidden_literals.each do |literal|
              fail_boundary.call(path, "Removed product surface reappeared: #{literal}") if content.include?(literal)
            end
          end

          executable_surfaces = []
          documents.each do |path, document|
            walk_strings.call(document) do |node_path, value|
              executable_surfaces << [path, node_path, value] if node_path.last == "run"
            end
          end
          Dir["scripts/*"].sort.each do |path|
            next unless File.file?(path)

            content = File.binread(path)
            next if content.include?("\0")
            executable_surfaces << [path, ["script"], content]
          end
          executable_surfaces.each do |path, node_path, command|
            if command.match?(go_command)
              fail_boundary.call(path, "Executable surface #{node_path.join("/")} invokes the removed Go toolchain.")
            end
            if (path == ".github/workflows/organization-scan.yml" || path.start_with?("scripts/")) &&
               command.match?(alternate_network_client)
              fail_boundary.call(path, "Executable surface #{node_path.join("/")} uses an unapproved network client.")
            end
          end

          publisher_permissions = {
            "issues" => "write",
            "contents" => "read",
            "actions" => "read"
          }
          validate_permissions = lambda do |permissions, path, scope, publisher|
            return if permissions.nil? || permissions == {}

            unless permissions.is_a?(Hash)
              fail_boundary.call(path, "#{scope} must not request #{permissions} permissions.") if permissions == "write-all"
              return
            end

            if publisher
              unless permissions["issues"] == "write" &&
                     permissions.all? { |name, access| publisher_permissions[name] == access }
                fail_boundary.call(path, "publish-dashboard permissions exceed the isolated publisher contract.")
              end
            elsif permissions.any? { |_, access| access == "write" }
              fail_boundary.call(path, "#{scope} must not request write permissions.")
            end
          end

          validate_action = lambda do |action, path|
            fail_boundary.call(path, "Action reference must be a string.") unless action.is_a?(String)
            return if action.start_with?("./")

            name = action.sub(/@[^@]+\z/, "")
            if name == "actions/setup-go"
              fail_boundary.call(path, "The Go toolchain action is not part of the workflow-only product: #{action}")
            end
            unless action.match?(/\A[^@\s]+@[0-9a-f]{40}\z/)
              fail_boundary.call(path, "Remote action is not pinned to a full commit SHA: #{action}")
            end
          end

          documents.each do |path, document|
            if path.start_with?(".github/workflows/")
              validate_permissions.call(document["permissions"], path, "workflow", false)
              document.fetch("jobs", {}).each do |job_name, job|
                unless job.is_a?(Hash)
                  fail_boundary.call(path, "Job #{job_name} must be a mapping.")
                end
                publisher = path == ".github/workflows/organization-scan.yml" && job_name == "publish-dashboard"
                validate_permissions.call(job["permissions"], path, "job #{job_name}", publisher)
                validate_action.call(job["uses"], path) if job.key?("uses")
                Array(job["steps"]).each do |step|
                  fail_boundary.call(path, "Every workflow step must be a mapping.") unless step.is_a?(Hash)
                  validate_action.call(step["uses"], path) if step.key?("uses")
                end
              end
            else
              Array(document.dig("runs", "steps")).each do |step|
                fail_boundary.call(path, "Every composite-action step must be a mapping.") unless step.is_a?(Hash)
                validate_action.call(step["uses"], path) if step.key?("uses")
              end
            end
          end

          organization_path = ".github/workflows/organization-scan.yml"
          organization = documents.fetch(organization_path)
          jobs = organization.fetch("jobs")
          plan_steps = Array(jobs.fetch("plan")["steps"])
          scan_steps = Array(jobs.fetch("scan")["steps"])
          targets = plan_steps.find { |step| step["id"] == "targets" }
          unless targets && targets["run"].is_a?(String)
            fail_boundary.call(organization_path, "The immutable target-planning step is missing.")
          end

          run_steps = []
          jobs.each do |job_name, job|
            Array(job["steps"]).each do |step|
              run_steps << [job_name, step["id"], step["run"]] if step["run"].is_a?(String)
            end
          end
          gh_api_steps = run_steps.select { |_, _, run| run.match?(/\bgh\s+api\b/) }
          unless gh_api_steps.length == 1 && gh_api_steps[0][0, 2] == ["plan", "targets"]
            fail_boundary.call(organization_path, "Only plan/targets may call gh api.")
          end

          targets_run = targets["run"].dup
          approved_api_calls = [
            /gh\s+api\s+--paginate\s+--slurp\s+\/installation\/repositories/,
            /gh\s+api\s+--method\s+GET\s+"repos\/\$full_name\/commits"\s*\\\s*-f\s+sha="\$default_branch"\s+-f\s+per_page=1/m
          ]
          approved_api_calls.each do |pattern|
            unless targets_run.sub!(pattern, "")
              fail_boundary.call(organization_path, "The target planner must retain the approved GitHub API calls.")
            end
          end
          if targets_run.match?(/\bgh\s+api\b/)
            fail_boundary.call(organization_path, "An unapproved GitHub API call was added to the target planner.")
          end

          target_token_expression = "$" + "{{ inputs.validation_mode && github.token || steps.target-token.outputs.token }}"
          target_step_index = scan_steps.index { |step| step["id"] == "target-token" }
          checkout_step_index = scan_steps.index { |step| step["id"] == "checkout" }
          scorecard_step_index = scan_steps.index { |step| step["id"] == "scorecard" }
          unless target_step_index && checkout_step_index && scorecard_step_index
            fail_boundary.call(organization_path, "The target token, checkout, and Scorecard steps must remain present.")
          end

          expected_target_token_nodes = {
            ["jobs", "scan", "steps", target_step_index, "id"] => "target-token",
            ["jobs", "scan", "steps", checkout_step_index, "with", "token"] => target_token_expression,
            ["jobs", "scan", "steps", scorecard_step_index, "env", "SEGH_TARGET_SCORECARD_TOKEN"] => target_token_expression
          }
          actual_target_token_nodes = {}
          walk_strings.call(organization) do |path, value|
            actual_target_token_nodes[path] = value if value.include?("target-token")
          end
          unless actual_target_token_nodes == expected_target_token_nodes
            fail_boundary.call(organization_path, "Target credentials must remain limited to the token step, target checkout, and Scorecard environment.")
          end

          allowed_results = %w[
            results/actionlint.jsonl
            results/actionlint.log
            results/preflight.txt
            results/scanner-versions.log
            results/scanner-versions.txt
            results/scorecard-permissions.json
            results/scorecard-status.txt
            results/scorecard.json
            results/scorecard.log
            results/shellcheck-status.txt
            results/shellcheck.json
            results/shellcheck.log
            results/target.json
            results/trivy-misconfiguration.json
            results/trivy-misconfiguration.log
            results/trivy-secret.json
            results/trivy-secret.log
            results/trivy-vulnerability.json
            results/trivy-vulnerability.log
            results/zizmor.json
            results/zizmor.log
          ].sort_by { |path| -path.length }
          artifact_step_index = scan_steps.index { |step| step["id"] == "artifact" }
          artifact = artifact_step_index && scan_steps[artifact_step_index]
          unless artifact&.dig("with", "path") == "results"
            fail_boundary.call(organization_path, "Artifact upload must remain limited to the results directory.")
          end

          walk_strings.call(organization) do |path, value|
            next unless value.match?(/\bresults\b/)
            next if path == ["jobs", "scan", "steps", artifact_step_index, "with", "path"] && value == "results"

            remaining = value.dup
            allowed_results.each { |approved| remaining.gsub!(approved, "") }
            remaining.gsub!(/\bmkdir\s+-p\s+["\x27]?results["\x27]?/, "")
            if remaining.match?(/\bresults\b/)
              fail_boundary.call(
                organization_path,
                "Unapproved or dynamically constructed results artifact path at #{path.join("/")}.")
            end
          end
          RUBY

          ruby -ryaml -rrubygems - <<'RUBY'
          minimum_scanners = {
            "ossf/scorecard" => "5.5.0",
            "zizmorcore/zizmor" => "1.28.0",
            "rhysd/actionlint" => "1.7.12",
            "koalaman/shellcheck" => "0.11.0",
            "aquasecurity/trivy" => "0.72.0"
          }
          version_pattern = /\Av?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\z/
          parse_version = lambda do |value|
            match = value.is_a?(String) && version_pattern.match(value)
            match && Gem::Version.new(match[1])
          end
          aqua = YAML.load_file("aqua.yaml")

          checksum = aqua.fetch("checksum", {})
          unless checksum["enabled"] == true && checksum["require_checksum"] == true
            warn "::error file=aqua.yaml::Aqua checksums must remain enabled and required."
            exit 1
          end

          registries = aqua.fetch("registries", [])
          registry = registries[0] if registries.is_a?(Array) && registries.length == 1
          registry_version = parse_version.call(registry["ref"]) if registry.is_a?(Hash)
          unless registry.is_a?(Hash) &&
                 registry["type"] == "standard" &&
                 registry_version &&
                 registry_version >= Gem::Version.new("4.544.0")
            warn "::error file=aqua.yaml::The Aqua standard registry must use one explicit non-downgraded semantic-version ref."
            exit 1
          end

          packages = aqua.fetch("packages", [])
          unless packages.is_a?(Array) && packages.length == minimum_scanners.length
            warn "::error file=aqua.yaml::The trusted Aqua profile must contain exactly five scanners."
            exit 1
          end

          minimum_scanners.each_with_index do |(expected, minimum), index|
            package = packages[index]
            name = package.is_a?(Hash) ? package["name"] : nil
            unless name.is_a?(String)
              warn "::error file=aqua.yaml::Scanner entry #{index} must contain a string name."
              exit 1
            end

            scanner, separator, package_version = name.rpartition("@")
            actual_version = parse_version.call(package_version)
            unless separator == "@" &&
                   scanner == expected &&
                   actual_version &&
                   actual_version >= Gem::Version.new(minimum)
              warn "::error file=aqua.yaml::Scanner #{index} must be #{expected} at an explicit non-downgraded semantic version."
              exit 1
            end
          end
          RUBY

  production-workflow:
    needs: workflow-only-boundary
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      validation_mode: true
      repository_limit: "50"
      max_parallel: "5"
