---
name: Validation

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install checksum-verified tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Validate credential boundaries
        run: ruby scripts/test-workflow-security.rb
      - name: Run actionlint
        run: |
          actionlint \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue.*SC2129' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml
      - name: Run zizmor
        run: >-
          zizmor --offline --no-config
          --min-severity high --min-confidence high
          .github/workflows
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate YAML and JSON
        run: |
          ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path) }'
          ruby -e 'require "json"; JSON.parse(File.read("aqua-checksums.json"))'
      - name: Verify Aqua checksums
        run: aqua i

  workflow-only-boundary:
    name: Workflow-only boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject removed product surfaces
        shell: bash
        run: |
          set -euo pipefail

          expected_paths=(
            .github/workflows/organization-scan.yml
            .github/workflows/validation.yml
            CREDENTIALS.md
            LICENSE
            README.md
            SECURITY.md
            aqua-checksums.json
            aqua.yaml
            scripts/preflight.sh
            scripts/test-workflow-security.rb
          )
          mapfile -d '' -t actual_paths < <(git ls-files -z)
          if ((${#actual_paths[@]} != ${#expected_paths[@]})); then
            echo "::error::Tracked path set differs from the workflow-only product allowlist."
            printf 'Expected paths:\n'
            printf '  %s\n' "${expected_paths[@]}"
            printf 'Actual paths:\n'
            printf '  %s\n' "${actual_paths[@]}"
            exit 1
          fi
          for index in "${!expected_paths[@]}"; do
            if [[ "${actual_paths[$index]}" != "${expected_paths[$index]}" ]]; then
              echo "::error::Unexpected tracked path at position $index: ${actual_paths[$index]}"
              exit 1
            fi
          done

          mapfile -d '' -t action_files < <(
            git ls-files -z -- \
              '.github/workflows/*.yml' \
              '.github/workflows/*.yaml' \
              ':(glob)**/action.yml' \
              ':(glob)**/action.yaml'
          )
          ruby -ryaml -e '
            tracked_files = IO.popen(["git", "ls-files", "-z"], &:read).split("\0")
            action_files = ARGV
            forbidden_literals = [
              ["dceoy/gha-for-", "devops"].join,
              ["golang", "ci"].join,
              ["inventory.", "json"].join,
              ["audit.", "json"].join,
              ["scan-manifest.", "json"].join,
              ["scan-summary.", "json"].join,
              ["scan-report.", "md"].join,
              ["reconcile-source-", "scan"].join,
              ["status.", "json"].join
            ]
            go_command = /(?:^|[;&|()\s])(?:["\x27]?(?:\$\(\s*(?:command\s+-v|which)\s+go\s*\)|[^\s;&|()"\x27`]*\/go|go)["\x27]?)\s+(?:test|build|vet|install|run|generate|fmt|env|list|mod|work|tool|version)(?:\s|$)/

            tracked_files.each do |path|
              content = File.binread(path)
              next if content.include?("\0")

              forbidden_literals.each do |literal|
                if content.include?(literal)
                  warn "::error file=#{path}::Removed product surface reappeared: #{literal}"
                  exit 1
                end
              end
              if content.match?(go_command)
                warn "::error file=#{path}::Go toolchain commands are not part of the workflow-only product."
                exit 1
              end
            end

            expected_permissions = {
              "issues" => "write",
              "contents" => "read",
              "actions" => "read"
            }
            validate_permissions = lambda do |permissions, path, scope, publisher|
              return if permissions.nil? || permissions == {}

              unless permissions.is_a?(Hash)
                if permissions == "write-all"
                  warn "::error file=#{path}::#{scope} must not request write-all permissions."
                  exit 1
                end
                next
              end

              if publisher
                unless permissions["issues"] == "write" &&
                       permissions.all? { |name, access| expected_permissions[name] == access }
                  warn "::error file=#{path}::publish-dashboard permissions exceed the isolated publisher contract."
                  exit 1
                end
              elsif permissions.any? { |_, access| access == "write" }
                warn "::error file=#{path}::#{scope} must not request write permissions."
                exit 1
              end
            end

            validate_action = lambda do |action, path|
              unless action.is_a?(String)
                warn "::error file=#{path}::Action reference must be a string."
                exit 1
              end
              return if action.start_with?("./")

              name = action.sub(/@[^@]+\z/, "")
              if name == "actions/setup-go"
                warn "::error file=#{path}::The Go toolchain action is not part of the workflow-only product: #{action}"
                exit 1
              end
              unless action.match?(/\A[^@\s]+@[0-9a-f]{40}\z/)
                warn "::error file=#{path}::Remote action is not pinned to a full commit SHA: #{action}"
                exit 1
              end
            end

            validate_step = lambda do |step, path|
              validate_action.call(step["uses"], path) if step.key?("uses")
            end

            action_files.each do |path|
              document = YAML.load_file(path)
              if path.start_with?(".github/workflows/")
                validate_permissions.call(document["permissions"], path, "workflow", false)
                document.fetch("jobs", {}).each do |job_name, job|
                  publisher = path == ".github/workflows/organization-scan.yml" &&
                              job_name == "publish-dashboard"
                  validate_permissions.call(job["permissions"], path, "job #{job_name}", publisher)
                  validate_action.call(job["uses"], path) if job.key?("uses")
                  Array(job["steps"]).each { |step| validate_step.call(step, path) }
                end
              else
                Array(document.dig("runs", "steps")).each { |step| validate_step.call(step, path) }
              end
            end
          ' "${action_files[@]}"

          ruby -ryaml -e '
            require "rubygems"

            minimum_scanners = {
              "ossf/scorecard" => "5.5.0",
              "zizmorcore/zizmor" => "1.28.0",
              "rhysd/actionlint" => "1.7.12",
              "koalaman/shellcheck" => "0.11.0",
              "aquasecurity/trivy" => "0.72.0"
            }
            version_pattern = /\Av?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\z/
            parse_version = lambda do |value|
              match = value.is_a?(String) && version_pattern.match(value)
              match && Gem::Version.new(match[1])
            end
            aqua = YAML.load_file("aqua.yaml")

            checksum = aqua.fetch("checksum", {})
            unless checksum["enabled"] == true && checksum["require_checksum"] == true
              warn "::error file=aqua.yaml::Aqua checksums must remain enabled and required."
              exit 1
            end

            registries = aqua.fetch("registries", [])
            registry = registries[0] if registries.is_a?(Array) && registries.length == 1
            registry_version = parse_version.call(registry["ref"]) if registry.is_a?(Hash)
            unless registry.is_a?(Hash) &&
                   registry["type"] == "standard" &&
                   registry_version &&
                   registry_version >= Gem::Version.new("4.544.0")
              warn "::error file=aqua.yaml::The Aqua standard registry must use one explicit non-downgraded semantic-version ref."
              exit 1
            end

            packages = aqua.fetch("packages", [])
            unless packages.is_a?(Array) && packages.length == minimum_scanners.length
              warn "::error file=aqua.yaml::The trusted Aqua profile must contain exactly five scanners."
              exit 1
            end

            minimum_scanners.each_with_index do |(expected, minimum), index|
              package = packages[index]
              name = package.is_a?(Hash) ? package["name"] : nil
              unless name.is_a?(String)
                warn "::error file=aqua.yaml::Scanner entry #{index} must contain a string name."
                exit 1
              end

              scanner, separator, package_version = name.rpartition("@")
              actual_version = parse_version.call(package_version)
              unless separator == "@" &&
                     scanner == expected &&
                     actual_version &&
                     actual_version >= Gem::Version.new(minimum)
                warn "::error file=aqua.yaml::Scanner #{index} must be #{expected} at an explicit non-downgraded semantic version."
                exit 1
              end
            end
          '

  production-workflow:
    needs: workflow-only-boundary
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      validation_mode: true
      repository_limit: "50"
      max_parallel: "5"
