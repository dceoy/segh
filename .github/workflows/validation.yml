---
name: Validation

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Validate workflow-only product
        run: ruby scripts/validate-workflow-boundary.rb .
      - name: Validate credential boundaries
        run: ruby scripts/test-workflow-security.rb
      - name: Validate reconciliation workflow boundaries
        run: ruby scripts/test-reconciliation-workflows.rb
      - name: Test dashboard normalization and publication
        run: node --test scripts/test-dashboard.js
      - name: Run actionlint
        run: |
          actionlint \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue.*SC2129' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml
      - name: Run zizmor
        run: >-
          zizmor --offline --no-config
          --min-severity high --min-confidence high
          .github/workflows
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate Ruby, YAML, and JSON
        run: |
          ruby -c scripts/validate-workflow-boundary.rb
          ruby -c scripts/test-reconciliation-workflows.rb
          ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}"].sort.each { |path| YAML.safe_load_file(path, aliases: false) }'
          ruby -e 'require "json"; JSON.parse(File.read("aqua-checksums.json"))'
      - name: Verify Aqua checksums
        run: aqua i

  production-workflow:
    needs: static
    permissions:
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      validation_mode: true
      repository_limit: "50"
      max_parallel: "5"
