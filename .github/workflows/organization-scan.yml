---
name: Organization source scan

on:
  workflow_call:
    inputs:
      repository_limit:
        description: Maximum accepted GitHub App repository selection; larger selections fail closed
        required: false
        type: string
        default: "50"
      max_parallel:
        description: Maximum number of repository scans to run concurrently
        required: false
        type: string
        default: "4"
      dashboard_publication:
        description: Dashboard publication mode for reusable callers; use deferred when a final reconciler owns issue writes
        required: false
        type: string
        default: "inline"
      validation_mode:
        description: Internal production-path validation; accepted only for dceoy/segh pull requests
        required: false
        type: boolean
        default: false
    secrets:
      SEGH_ORG_SCAN_APP_ID:
        required: false
      SEGH_ORG_SCAN_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      repository_limit:
        description: Maximum accepted GitHub App repository selection; larger selections fail closed
        required: false
        type: string
        default: "50"
      max_parallel:
        description: Maximum number of repository scans to run concurrently
        required: false
        type: string
        default: "4"
  schedule:
    - cron: "17 3 * * 0"

permissions: {}

concurrency:
  group: segh-organization-source-scan-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    permissions: {}
    if: github.event_name != 'schedule' || github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
      max_parallel: ${{ steps.targets.outputs.max_parallel }}
    steps:
      - name: Require a private control repository
        if: inputs.validation_mode != true
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != true ]]; then
            echo "::error::Run organization scans only from a private control repository so findings remain private."
            exit 1
          fi
      - name: Require GitHub App credentials
        if: inputs.validation_mode != true
        env:
          APP_ID: ${{ secrets.SEGH_ORG_SCAN_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEGH_ORG_SCAN_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::SEGH_ORG_SCAN_APP_ID and SEGH_ORG_SCAN_APP_PRIVATE_KEY are required."
            exit 1
          fi
      - name: Create installation read token
        if: inputs.validation_mode != true
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_ORG_SCAN_APP_ID }}
          private-key: ${{ secrets.SEGH_ORG_SCAN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: read
          permission-metadata: read
      - name: Resolve complete immutable target plan
        id: targets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_LIMIT: ${{ inputs.repository_limit || '50' }}
          MAX_PARALLEL: ${{ inputs.max_parallel || '4' }}
        with:
          github-token: ${{ inputs.validation_mode && github.token || steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const shaPattern = /^[0-9a-f]{40}$/;
            const boundedInteger = (raw, name, min, max) => {
              const value = Number(raw);
              if (!/^\d+$/.test(raw) || !Number.isSafeInteger(value) || value < min || value > max) {
                throw new Error(`${name} must be an integer from ${min} to ${max}.`);
              }
              return value;
            };
            const validRepository = (repository) => Number.isInteger(repository?.id) && repository.id > 0 &&
              typeof repository.owner === 'string' && repository.owner.length > 0 && !repository.owner.includes('/') &&
              typeof repository.name === 'string' && repository.name.length > 0 && !repository.name.includes('/') &&
              repository.full_name === `${repository.owner}/${repository.name}` &&
              ['public', 'private', 'internal'].includes(repository.visibility) && typeof repository.fork === 'boolean' &&
              typeof repository.default_branch === 'string' && repository.default_branch.length > 0;
            const selectRepositories = (repositories, limit) => {
              if (!Array.isArray(repositories)) throw new Error('GitHub App repository enumeration returned malformed data.');
              const ids = new Set();
              const selected = [];
              for (const repository of repositories) {
                if (ids.has(repository?.id)) throw new Error('GitHub App repository enumeration returned duplicate repository IDs.');
                ids.add(repository?.id);
                if (repository?.disabled === true || repository?.archived === true) continue;
                const candidate = {
                  id: repository?.id, full_name: repository?.full_name, owner: repository?.owner?.login,
                  name: repository?.name, visibility: repository?.visibility, fork: repository?.fork,
                  default_branch: repository?.default_branch,
                };
                if (!validRepository(candidate)) throw new Error('At least one selected repository has malformed or missing identity metadata.');
                selected.push(candidate);
              }
              selected.sort((left, right) => left.full_name < right.full_name ? -1 : left.full_name > right.full_name ? 1 : 0);
              if (selected.length > limit) {
                throw new Error(`GitHub App selected ${selected.length} repositories, exceeding repository_limit=${limit}; refusing incomplete coverage.`);
              }
              return selected;
            };
            const listInstallationRepositories = async (client) => {
              const totalCount = async () => {
                const {data} = await client.request('GET /installation/repositories', {per_page: 1});
                if (!data || !Number.isInteger(data.total_count) || data.total_count < 0 || !Array.isArray(data.repositories)) {
                  throw new Error('GitHub App installation repository enumeration returned malformed count metadata.');
                }
                return data.total_count;
              };
              const before = await totalCount();
              const repositories = await client.paginate('GET /installation/repositories', {per_page: 100});
              const after = await totalCount();
              if (before !== after || repositories.length !== before) {
                throw new Error(`GitHub App repository pagination was not stable and complete: before=${before}, fetched=${repositories.length}, after=${after}.`);
              }
              return repositories;
            };
            const resolveMatrix = async (client, repositories) => {
              const include = [];
              for (const repository of repositories) {
                try {
                  const {data} = await client.rest.repos.getCommit({
                    owner: repository.owner, repo: repository.name, ref: repository.default_branch,
                  });
                  if (!shaPattern.test(data?.sha || '')) throw new Error('response did not contain a lowercase 40-character SHA');
                  include.push({...repository, commit_sha: data.sha});
                } catch (error) {
                  throw new Error(`${repository.full_name}: failed to resolve default branch ${repository.default_branch}: ${error.message}`);
                }
              }
              return {include};
            };
            const validateMatrix = (matrix) => {
              if (!Array.isArray(matrix?.include) || matrix.include.some((target) =>
                !validRepository(target) || !shaPattern.test(target.commit_sha || ''))) {
                throw new Error('Refusing to emit a malformed or incomplete scan matrix.');
              }
            };
            const expectFailure = async (operation, pattern) => {
              try { await operation(); } catch (error) { if (pattern.test(error.message)) return; throw error; }
              throw new Error(`Expected validation failure matching ${pattern}.`);
            };
            const repositoryLimit = boundedInteger(process.env.REPOSITORY_LIMIT, 'repository_limit', 1, 100);
            const maxParallel = boundedInteger(process.env.MAX_PARALLEL, 'max_parallel', 1, 10);
            let matrix;

            if (process.env.VALIDATION_MODE === 'true') {
              if (process.env.CALLER_REPOSITORY !== 'dceoy/segh' || process.env.EVENT_NAME !== 'pull_request') {
                throw new Error('validation_mode is restricted to pull requests in dceoy/segh.');
              }
              if (!shaPattern.test(process.env.HEAD_SHA || '')) {
                throw new Error('The validation pull request head must resolve to an immutable commit SHA.');
              }
              const repository = (id, name, extra = {}) => ({
                id, name, full_name: `dceoy/${name}`, owner: {login: 'dceoy'}, visibility: 'public', fork: false,
                default_branch: 'main', archived: false, disabled: false, ...extra,
              });
              const alpha = repository(1, 'alpha');
              const beta = repository(2, 'beta', {fork: true});
              const paginated = await listInstallationRepositories({
                request: async () => ({data: {total_count: 2, repositories: [alpha]}}),
                paginate: async () => [alpha, beta],
              });
              if (paginated.length !== 2) throw new Error('Octokit pagination validation did not preserve complete coverage.');
              const selected = selectRepositories([
                repository(3, 'zeta'), beta, alpha, repository(4, 'archived', {archived: true}),
                repository(5, 'disabled', {disabled: true}),
              ], 3);
              if (selected.map(({full_name}) => full_name).join(',') !== 'dceoy/alpha,dceoy/beta,dceoy/zeta' || !selected[1].fork) {
                throw new Error('Repository filtering, fork inclusion, or deterministic ordering changed.');
              }
              await expectFailure(() => selectRepositories([alpha, alpha], 2), /duplicate repository IDs/);
              await expectFailure(() => selectRepositories([repository(6, 'bad', {owner: {login: ''}})], 1), /malformed or missing identity/);
              await expectFailure(() => selectRepositories([alpha, beta], 1), /exceeding repository_limit=1/);
              if (selectRepositories([], 1).length !== 0) throw new Error('Empty installation selection must remain valid.');
              await expectFailure(() => resolveMatrix({rest: {repos: {getCommit: async () => { throw new Error('not found'); }}}}, [alpha]), /failed to resolve default branch/);
              const resolved = await resolveMatrix({rest: {repos: {getCommit: async () => ({data: {sha: process.env.HEAD_SHA}})}}}, selected);
              validateMatrix(resolved);
              const target = (id, validationCase, commitSha) => ({
                id, full_name: 'dceoy/segh', owner: 'dceoy', name: 'segh', visibility: 'public', fork: false,
                default_branch: 'main', commit_sha: commitSha, validation_case: validationCase,
              });
              matrix = {include: [
                target(900001, 'clean', process.env.HEAD_SHA), target(900002, 'no-exec', process.env.HEAD_SHA),
                target(900003, 'scanner-runtime-error', process.env.HEAD_SHA),
                target(900004, 'checkout-failure', '0000000000000000000000000000000000000000'),
              ]};
            } else {
              let repositories;
              try { repositories = await listInstallationRepositories(github); }
              catch (error) { throw new Error(`GitHub App installation repository enumeration failed: ${error.message}`); }
              matrix = await resolveMatrix(github, selectRepositories(repositories, repositoryLimit));
            }

            validateMatrix(matrix);
            if (matrix.include.length > repositoryLimit) throw new Error(`Resolved scan matrix violates repository_limit=${repositoryLimit}.`);
            const matrixJson = JSON.stringify(matrix);
            fs.writeFileSync('matrix.json', `${matrixJson}\n`);
            core.setOutput('matrix', matrixJson);
            core.setOutput('has_targets', matrix.include.length > 0 ? 'true' : 'false');
            core.setOutput('max_parallel', String(maxParallel));
      - name: Retain bounded publication plan
        if: steps.targets.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-scan-plan
          path: matrix.json
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Source scan / ${{ matrix.full_name }}${{ matrix.validation_case && format(' / {0}', matrix.validation_case) || '' }}
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    env:
      AQUA_CONFIG: ${{ github.workspace }}/_trusted/aqua.yaml
    steps:
      - name: Record immutable target metadata
        id: target
        continue-on-error: ${{ inputs.validation_mode }}
        env:
          REPOSITORY_ID: ${{ matrix.id }}
          REPOSITORY: ${{ matrix.full_name }}
          REPOSITORY_OWNER: ${{ matrix.owner }}
          REPOSITORY_NAME: ${{ matrix.name }}
          VISIBILITY: ${{ matrix.visibility }}
          FORK: ${{ matrix.fork }}
          DEFAULT_BRANCH: ${{ matrix.default_branch }}
          COMMIT_SHA: ${{ matrix.commit_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          VALIDATION_CASE: ${{ matrix.validation_case }}
        run: |
          mkdir -p results
          if [[ ! "$REPOSITORY_ID" =~ ^[0-9]+$ || ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ || \
                ! "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$REPOSITORY: invalid immutable identity metadata."
            exit 1
          fi
          jq -n \
            --argjson repository_id "$REPOSITORY_ID" \
            --arg repository "$REPOSITORY" \
            --arg owner "$REPOSITORY_OWNER" \
            --arg name "$REPOSITORY_NAME" \
            --arg visibility "$VISIBILITY" \
            --argjson fork "$FORK" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg commit_sha "$COMMIT_SHA" \
            --argjson workflow_run_id "$WORKFLOW_RUN_ID" \
            --argjson workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg trusted_workflow_repository "$TRUSTED_WORKFLOW_REPOSITORY" \
            --arg trusted_workflow_sha "$TRUSTED_WORKFLOW_SHA" \
            --arg validation_case "$VALIDATION_CASE" \
            '{
              repository_id: $repository_id,
              repository: $repository,
              owner: $owner,
              name: $name,
              visibility: $visibility,
              fork: $fork,
              default_branch: $default_branch,
              commit_sha: $commit_sha,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              trusted_workflow_repository: $trusted_workflow_repository,
              trusted_workflow_sha: $trusted_workflow_sha
            } + if $validation_case == "" then {} else {validation_case: $validation_case} end' \
            > results/target.json
          jq -e \
            --argjson repository_id "$REPOSITORY_ID" \
            --arg repository "$REPOSITORY" \
            --arg owner "$REPOSITORY_OWNER" \
            --arg name "$REPOSITORY_NAME" \
            --arg visibility "$VISIBILITY" \
            --argjson fork "$FORK" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg commit_sha "$COMMIT_SHA" \
            --argjson workflow_run_id "$WORKFLOW_RUN_ID" \
            --argjson workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg trusted_workflow_repository "$TRUSTED_WORKFLOW_REPOSITORY" \
            --arg trusted_workflow_sha "$TRUSTED_WORKFLOW_SHA" \
            --arg validation_case "$VALIDATION_CASE" \
            'type == "object" and
             .repository_id == $repository_id and
             .repository == $repository and
             .owner == $owner and
             .name == $name and
             .visibility == $visibility and
             .fork == $fork and
             .default_branch == $default_branch and
             .commit_sha == $commit_sha and
             .workflow_run_id == $workflow_run_id and
             .workflow_run_attempt == $workflow_run_attempt and
             .trusted_workflow_repository == $trusted_workflow_repository and
             .trusted_workflow_sha == $trusted_workflow_sha and
             (.validation_case // "") == $validation_case' \
            results/target.json > /dev/null
          cat > results/scorecard-permissions.json <<'EOF_SCORECARD'
          {
            "granted": [
              "metadata:read",
              "contents:read",
              "checks:read",
              "issues:read",
              "pull_requests:read"
            ],
            "not_granted": ["actions", "administration"],
            "limitations": [
              "Classic branch-protection administrator-only settings are not measured.",
              "The experimental Webhooks check is not supported."
            ]
          }
          EOF_SCORECARD
      - name: Check out trusted scanner configuration
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _trusted
          persist-credentials: false
      - name: Create repository-scoped read-only token
        if: inputs.validation_mode != true
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_ORG_SCAN_APP_ID }}
          private-key: ${{ secrets.SEGH_ORG_SCAN_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-metadata: read
          permission-pull-requests: read
      - name: Check out untrusted target revision
        id: checkout
        continue-on-error: ${{ inputs.validation_mode }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.full_name }}
          ref: ${{ matrix.commit_sha }}
          token: ${{ inputs.validation_mode && github.token || steps.target-token.outputs.token }}
          path: _target
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Prepare boundary smoke fixture
        if: inputs.validation_mode && steps.checkout.outcome == 'success'
        env:
          CASE: ${{ matrix.validation_case }}
        run: |
          git -C _target rm -qr --cached -- .
          find _target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          case "$CASE" in
            clean|scanner-runtime-error)
              mkdir -p _target/.github/workflows
              cat > _target/.github/workflows/fixture.yml <<'EOF_FIXTURE'
          ---
          name: Fixture
          on:
            push:
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-24.04
              steps:
                - run: "true"
          EOF_FIXTURE
              cat > _target/test.sh <<'EOF_FIXTURE'
          #!/bin/sh
          printf '%s\n' clean > /dev/null
          EOF_FIXTURE
              ;;
            no-exec)
              mkdir -p _target/.github/actions/owned _target/.githooks
              printf '{"scripts":{"install":"touch executed.marker","build":"touch executed.marker","test":"touch executed.marker"}}\n' \
                > _target/package.json
              printf 'all:\n\ttouch executed.marker\n' > _target/Makefile
              printf '#!/bin/sh\ntouch executed.marker\n' > _target/install.sh
              printf '#!/bin/sh\ntouch executed.marker\n' > _target/.githooks/post-checkout
              cat > _target/.github/actions/owned/action.yml <<'EOF_FIXTURE'
          ---
          name: Untrusted action
          runs:
            using: composite
            steps:
              - shell: bash
                run: touch executed.marker
          EOF_FIXTURE
              cat > _target/main.tf <<'EOF_FIXTURE'
          terraform {
            required_providers {
              external = { source = "hashicorp/external" }
            }
          }
          data "external" "untrusted" {
            program = ["./install.sh"]
          }
          EOF_FIXTURE
              ;;
            checkout-failure)
              echo "::error::checkout-failure must not reach fixture preparation."
              exit 1
              ;;
            *)
              echo "::error::Unknown validation case: $CASE"
              exit 1
              ;;
          esac
          git -C _target add .
      - name: Install checksum-verified scanners
        if: steps.checkout.outcome == 'success'
        id: tools
        continue-on-error: ${{ inputs.validation_mode }}
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.1
          working_directory: _trusted
      - name: Record scanner versions
        if: steps.tools.outcome == 'success'
        id: versions
        continue-on-error: ${{ inputs.validation_mode }}
        run: |
          {
            printf 'scorecard: '; scorecard version
            printf 'zizmor: '; zizmor --version
            printf 'actionlint: '; actionlint -version
            printf 'shellcheck: '; shellcheck --version | head -n 2 | tail -n 1
            printf 'trivy: '; trivy --version | head -n 1
          } > results/scanner-versions.txt 2> results/scanner-versions.log
      - name: Validate target content
        if: steps.checkout.outcome == 'success' && steps.tools.outcome == 'success'
        id: preflight
        continue-on-error: ${{ inputs.validation_mode }}
        shell: bash
        run: _trusted/scripts/preflight.sh _target 2>&1 | tee results/preflight.txt
      - name: Run OpenSSF Scorecard
        if: always() && steps.preflight.outcome == 'success'
        id: scorecard
        continue-on-error: ${{ inputs.validation_mode }}
        env:
          SEGH_TARGET_SCORECARD_TOKEN: ${{ inputs.validation_mode && github.token || steps.target-token.outputs.token }}
          REPOSITORY: ${{ matrix.full_name }}
          COMMIT_SHA: ${{ matrix.commit_sha }}
        run: |
          set +e
          echo "::add-mask::$SEGH_TARGET_SCORECARD_TOKEN"
          GITHUB_AUTH_TOKEN="$SEGH_TARGET_SCORECARD_TOKEN" scorecard --repo="$REPOSITORY" --commit="$COMMIT_SHA" --show-details --format=json \
            > results/scorecard.json 2> results/scorecard.log
          status=$?
          set -e
          printf '%s\n' "$status" > results/scorecard-status.txt
          if ((status != 0)); then
            exit "$status"
          fi
          jq -e 'type == "object" and (.checks | type == "array" and length > 0)' \
            results/scorecard.json > /dev/null
      - name: Run zizmor
        if: always() && steps.preflight.outcome == 'success'
        id: zizmor
        continue-on-error: ${{ inputs.validation_mode }}
        run: |
          files=()
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            case "$mode" in
              100644|100755) files+=("${entry#*$'\t'}") ;;
            esac
          done < <(git -C _target ls-files --stage -z -- '.github/workflows/*.yml' \
            '.github/workflows/*.yaml' ':(glob)**/action.yml' ':(glob)**/action.yaml')
          if ((${#files[@]} == 0)); then
            printf '[]\n' > results/zizmor.json
            : > results/zizmor.log
            exit 0
          fi
          (cd _target && zizmor --offline --no-config --no-ignores --strict-collection --persona regular \
            --min-severity medium --min-confidence high --format json "${files[@]}") \
            > results/zizmor.json 2> results/zizmor.log
      - name: Run actionlint
        if: always() && steps.preflight.outcome == 'success'
        id: actionlint
        continue-on-error: ${{ inputs.validation_mode }}
        run: |
          files=()
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            case "$mode" in
              100644|100755) files+=("${entry#*$'\t'}") ;;
            esac
          done < <(git -C _target ls-files --stage -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if ((${#files[@]} == 0)); then
            : > results/actionlint.jsonl
            : > results/actionlint.log
            exit 0
          fi
          (cd _target && SHELLCHECK_OPTS='--rcfile=/dev/null' actionlint --no-color --config-file /dev/null \
            --shellcheck shellcheck --format '{{json .}}' "${files[@]}") \
            > results/actionlint.jsonl 2> results/actionlint.log
      - name: Run ShellCheck
        if: always() && steps.preflight.outcome == 'success'
        id: shellcheck
        continue-on-error: ${{ inputs.validation_mode }}
        env:
          VALIDATION_CASE: ${{ matrix.validation_case }}
        run: |
          has_supported_shell_shebang() {
            local line=$1
            local command rest interpreter
            [[ "$line" == '#!'* ]] || return 1
            line=${line#\#!}
            line=${line#"${line%%[![:space:]]*}"}
            read -r command rest <<< "$line"
            interpreter=${command##*/}
            case "$interpreter" in
              sh|bash|dash|ksh) return 0 ;;
              env)
                read -r command rest <<< "$rest"
                if [[ "$command" == -S ]]; then
                  read -r command rest <<< "$rest"
                fi
                interpreter=${command##*/}
                case "$interpreter" in
                  sh|bash|dash|ksh) return 0 ;;
                esac
                ;;
            esac
            return 1
          }

          files=()
          declare -A seen=()
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            case "$mode" in
              100644|100755) ;;
              *) continue ;;
            esac
            path=${entry#*$'\t'}
            include=false
            case "$path" in
              *.sh|*.bash|*.bats) include=true ;;
            esac
            if [[ "$include" == false ]]; then
              first_line=''
              IFS= LC_ALL=C read -r -n 256 first_line < "_target/$path" || true
              if has_supported_shell_shebang "$first_line"; then
                include=true
              fi
            fi
            if [[ "$include" == true && -z "${seen[$path]:-}" ]]; then
              files+=("$path")
              seen[$path]=1
            fi
          done < <(git -C _target ls-files --stage -z)
          if ((${#files[@]} == 0)); then
            printf '[]\n' > results/shellcheck.json
            : > results/shellcheck.log
            printf '0\n' > results/shellcheck-status.txt
            exit 0
          fi
          format=json1
          if [[ "$VALIDATION_CASE" == scanner-runtime-error ]]; then
            format=invalid
          fi
          set +e
          (cd _target && shellcheck --color=never --format="$format" --rcfile /dev/null --severity=style -- "${files[@]}") \
            > results/shellcheck.json 2> results/shellcheck.log
          status=$?
          set -e
          printf '%s\n' "$status" > results/shellcheck-status.txt
          exit "$status"
      - name: Run Trivy vulnerability scan
        if: always() && steps.preflight.outcome == 'success'
        id: trivy-vulnerability
        continue-on-error: ${{ inputs.validation_mode }}
        run: |
          trivy filesystem --config /dev/null --ignorefile /dev/null --scanners vuln \
            --exit-code 1 --format json --output results/trivy-vulnerability.json \
            --skip-dirs _target/.git --skip-version-check _target \
            2> results/trivy-vulnerability.log
      - name: Run Trivy secret scan
        if: always() && steps.preflight.outcome == 'success'
        id: trivy-secret
        continue-on-error: ${{ inputs.validation_mode }}
        run: |
          trivy filesystem --config /dev/null --ignorefile /dev/null --scanners secret \
            --exit-code 1 --format json --output results/trivy-secret.json \
            --skip-dirs _target/.git --skip-version-check _target \
            2> results/trivy-secret.log
      - name: Run Trivy misconfiguration scan
        if: always() && steps.preflight.outcome == 'success'
        id: trivy-misconfiguration
        continue-on-error: ${{ inputs.validation_mode }}
        run: |
          trivy filesystem --config /dev/null --ignorefile /dev/null --scanners misconfig \
            --exit-code 1 --format json --output results/trivy-misconfiguration.json \
            --skip-dirs _target/.git --skip-version-check _target \
            2> results/trivy-misconfiguration.log
      - name: Build bounded dashboard summary
        if: always() && steps.target.outcome == 'success' && steps.trusted.outcome == 'success'
        id: summary
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          VERSIONS_OUTCOME: ${{ steps.versions.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SCORECARD_OUTCOME: ${{ steps.scorecard.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
          TRIVY_VULNERABILITY_OUTCOME: ${{ steps.trivy-vulnerability.outcome }}
          TRIVY_SECRET_OUTCOME: ${{ steps.trivy-secret.outcome }}
          TRIVY_MISCONFIGURATION_OUTCOME: ${{ steps.trivy-misconfiguration.outcome }}
          DASHBOARD_REPOSITORY: ${{ github.repository }}
        run: node _trusted/scripts/build-dashboard-summary.js results results/summary.json
      - name: Retain bounded dashboard summary
        if: always() && hashFiles('results/summary.json') != ''
        id: summary-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-summary-${{ matrix.id }}
          path: results/summary.json
          if-no-files-found: error
          retention-days: 31
      - name: Retain private raw scanner artifacts
        if: always() && hashFiles('results/target.json') != ''
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.validation_case && format('validation-{0}', matrix.validation_case) || format('repository-scan-{0}', matrix.id) }}
          path: results
          if-no-files-found: error
          retention-days: 14
      - name: Assert production boundary smoke outcomes
        if: always() && inputs.validation_mode
        env:
          CASE: ${{ matrix.validation_case }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          VERSIONS: ${{ steps.versions.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
          SUMMARY_ARTIFACT: ${{ steps.summary-artifact.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          expect() {
            local label=$1
            local actual=$2
            local expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$CASE: $label outcome was $actual, expected $expected."
              exit 1
            fi
          }
          expect summary "$SUMMARY" success
          expect summary-artifact "$SUMMARY_ARTIFACT" success
          expect artifact "$ARTIFACT" success
          [[ -f results/target.json && -f results/summary.json ]]
          overall=$(jq -er '.overall_status' results/summary.json)

          if [[ "$CASE" == checkout-failure ]]; then
            expect checkout "$CHECKOUT" failure
            expect dashboard-summary "$overall" error
            exit 0
          fi

          expect checkout "$CHECKOUT" success
          expect tools "$TOOLS" success
          expect versions "$VERSIONS" success
          expect preflight "$PREFLIGHT" success
          [[ -f results/scanner-versions.txt && -f results/preflight.txt ]]

          case "$CASE" in
            clean)
              expect dashboard-summary "$overall" pass
              ;;
            scanner-runtime-error)
              expect shellcheck "$SHELLCHECK" failure
              [[ "$(cat results/shellcheck-status.txt)" -ge 2 ]]
              expect dashboard-summary "$overall" error
              ;;
            no-exec)
              [[ "$overall" == pass || "$overall" == findings ]]
              [[ ! -e _target/executed.marker && ! -e executed.marker ]]
              ;;
            *)
              echo "::error::Unknown validation case: $CASE"
              exit 1
              ;;
          esac

  publish-dashboard:
    name: Publish security dashboards
    needs:
      - plan
      - scan
    if: >-
      always() &&
      inputs.validation_mode != true &&
      inputs.dashboard_publication != 'deferred' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      SEGH_DASHBOARD_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require a private dashboard repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != true ]]; then
            echo "::error::Dashboard publication requires a private control repository."
            exit 1
          fi
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _trusted
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Download authoritative plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: organization-scan-plan
          path: dashboard-input/plan
      - name: Download normalized summaries
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repository-summary-*
          path: dashboard-input/summaries
      - name: Publish dashboards sequentially
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        with:
          retries: 3
          script: |
            const publish = require('./_trusted/scripts/publish-dashboard.js');
            await publish({
              github,
              context,
              core,
              planPath: 'dashboard-input/plan/matrix.json',
              summariesPath: 'dashboard-input/summaries',
              repositoryPrivate: process.env.REPOSITORY_PRIVATE,
            });
