name: Reusable PR security

on:
  workflow_call:
    inputs:
      segh-ref:
        description: Full commit SHA of dceoy/segh to check out, matching the pinned reusable-workflow revision above.
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out trusted segh revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.workflow_sha/github.workflow_ref resolve to the CALLER's commit in a
          # workflow_call context, not this reusable workflow's own dceoy/segh commit, so
          # the exact revision must be passed explicitly by the caller instead.
          repository: dceoy/segh
          ref: ${{ inputs.segh-ref }}
          path: _segh
          persist-credentials: false
      - name: Check out pull request data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _target
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install checksum-verified scanners
        uses: aquaproj/aqua-installer@a78671ff723534c879a9c8aa62c99a3a05dddb49 # v4.0.5
        with:
          aqua_version: v2.62.1
          working_directory: _segh
      - name: Build trusted segh binary
        working-directory: _segh
        run: go build -trimpath -o ../segh-bin ./cmd/segh
      - name: Prepare changed-file and base worktrees
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_TREE: ${{ runner.temp }}/segh-base
        run: |
          set -euo pipefail
          # --name-status -M so renames are reported as old/new path pairs. A rename-only
          # --name-only diff would report just the new path, so the base-tree scan (which
          # only has the old path on disk) would filter it out and never scan it, letting
          # a pre-existing finding at the old path silently reappear as "new" post-rename.
          # Rename (R) pairs are also recorded in renames.zlist so the gate step can remap
          # baseline findings from their old path to their new path before comparing,
          # instead of the rename alone making a pre-existing finding look new. Copy (C)
          # pairs are excluded: the old path still exists in the head tree for a copy, so
          # remapping it would wrongly suppress a genuinely new finding at the new path
          # and misreport the still-present old-path finding as new.
          : > changed-files.zlist
          : > renames.zlist
          while IFS= read -r -d '' change_status; do
            case "$change_status" in
              R*|C*)
                IFS= read -r -d '' old_path
                IFS= read -r -d '' new_path
                printf '%s\0' "$old_path" "$new_path" >> changed-files.zlist
                if [[ "$change_status" == R* ]]; then
                  printf '%s\0' "$old_path" "$new_path" >> renames.zlist
                fi
                ;;
              *)
                IFS= read -r -d '' changed_path
                printf '%s\0' "$changed_path" >> changed-files.zlist
                ;;
            esac
          done < <(git -C _target diff --name-status -M -z "$BASE_SHA" "$HEAD_SHA" --)
          git -C _target worktree add --detach "$BASE_TREE" "$BASE_SHA"
          # Zizmor follows local composite actions and reusable workflows. Include
          # the complete .github tree from both revisions so a changed workflow
          # cannot hide an unpinned dependency inside an unchanged local action.
          # The NUL-safe sort removes paths already present in the changed-file
          # diff and paths shared by the head and baseline trees.
          for tree in _target "$BASE_TREE"; do
            while IFS= read -r -d '' github_path; do
              printf '%s\0' "$github_path" >> changed-files.zlist
            done < <(
              cd "$tree"
              find .github \( -type f -o -type l \) -print0 2> /dev/null
            )
          done
          LC_ALL=C sort -zu changed-files.zlist -o changed-files.zlist
      - name: Scan current and baseline files
        env:
          BASE_TREE: ${{ runner.temp }}/segh-base
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          ./segh-bin --config _segh/config/pr.yaml scan \
            --path _target \
            --repository "$TARGET_REPOSITORY" \
            --changed-file-list0 changed-files.zlist \
            --output segh-results/head/scan.json \
            --output-directory segh-results/head
          head_status=$?
          ./segh-bin --config _segh/config/pr.yaml scan \
            --path "$BASE_TREE" \
            --repository "$TARGET_REPOSITORY" \
            --changed-file-list0 changed-files.zlist \
            --output segh-results/base/scan.json \
            --output-directory segh-results/base
          base_status=$?
          if (( head_status > 1 || base_status > 1 )); then
            exit 5
          fi
      - name: Gate new findings
        run: |
          ./segh-bin --config _segh/config/pr.yaml pr-gate \
            --current segh-results/head/sarif \
            --baseline segh-results/base/sarif \
            --rename-map0 renames.zlist \
            --output segh-results/pr-gate.json \
            --markdown segh-results/pr-gate.md \
            --annotations
      - name: Add operator summary
        if: always()
        run: |
          if test -f segh-results/pr-gate.md; then
            cat segh-results/pr-gate.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw SARIF and normalized results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: segh-pr-${{ github.event.pull_request.number }}
          path: segh-results
          if-no-files-found: error
          retention-days: 14
