name: Publish PR security

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] This pinned follow-up only uploads SARIF and never executes PR code.
    workflows: [PR security]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download scanner SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-sarif-${{ github.event.workflow_run.pull_requests[0].number }}
          path: security-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Upload zizmor SARIF
        if: ${{ hashFiles('security-results/zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/zizmor.sarif
          checkout_path: _target
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}
          category: zizmor
          wait-for-processing: true
      - name: Upload Trivy SARIF
        if: ${{ hashFiles('security-results/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/trivy.sarif
          checkout_path: _target
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}
          category: trivy
          wait-for-processing: true
      - name: Upload Scorecard SARIF
        if: ${{ hashFiles('security-results/scorecard.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/scorecard.sarif
          checkout_path: _target
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}
          category: scorecard
          wait-for-processing: true
