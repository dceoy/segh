name: Publish PR security

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] This pinned follow-up only uploads SARIF and never executes PR code.
    workflows: [PR security]
    types: [completed]

permissions: {}

jobs:
  publish:
    # Install this workflow on each target repository's protected default
    # branch. The ruleset workflow source repository is intentionally excluded.
    if: github.repository != 'dceoy/segh' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Validate triggering workflow identity
        env:
          ACTUAL_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          EXPECTED_WORKFLOW_ID: ${{ vars.SEGH_PR_SECURITY_WORKFLOW_ID }}
        run: |
          if [[ ! "$EXPECTED_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "SEGH_PR_SECURITY_WORKFLOW_ID must identify the central ruleset workflow" >&2
            exit 1
          fi
          if [[ "$ACTUAL_WORKFLOW_ID" != "$EXPECTED_WORKFLOW_ID" ]]; then
            echo "refusing artifacts from unexpected workflow $ACTUAL_WORKFLOW_ID" >&2
            exit 1
          fi
      - name: Download scanner SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-security-publication
          path: security-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download Scorecard SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-security-scorecard
          path: security-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate publication metadata
        id: metadata
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(< security-results/pr-number)"
          head_sha="$(< security-results/head-sha)"

          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid pull request number in publication metadata" >&2
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ || "$head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "publication metadata does not match the triggering workflow run" >&2
            exit 1
          fi

          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
      - name: Check out analyzed source for SARIF fingerprints
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.metadata.outputs.pr_number }}/head
          path: _target
          persist-credentials: false
          # workflow_run blocks fork source by default. This trusted publisher
          # only reads files for fingerprints and never executes the checkout.
          allow-unsafe-pr-checkout: true
      - name: Verify analyzed source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual_head_sha="$(git -C _target rev-parse HEAD)"
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "checked-out pull request ref does not match the analyzed commit" >&2
            exit 1
          fi
      - name: Upload zizmor SARIF
        if: ${{ hashFiles('security-results/zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/zizmor.sarif
          checkout_path: _target
          ref: refs/pull/${{ steps.metadata.outputs.pr_number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}
          category: zizmor
          wait-for-processing: true
      - name: Upload Trivy SARIF
        if: ${{ hashFiles('security-results/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/trivy.sarif
          checkout_path: _target
          ref: refs/pull/${{ steps.metadata.outputs.pr_number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}
          category: trivy
          wait-for-processing: true
      - name: Upload Scorecard SARIF
        if: ${{ hashFiles('security-results/scorecard.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/scorecard.sarif
          checkout_path: _target
          ref: refs/pull/${{ steps.metadata.outputs.pr_number }}/head
          sha: ${{ github.event.workflow_run.head_sha }}
          category: scorecard
          wait-for-processing: true
