name: PR security

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  scan-self:
    # pull_request_target sources this job's definition from the base branch
    # (never from the pull request's proposed changes), so editing this file
    # in a pull request cannot disable or weaken the checks that run against
    # that same pull request. Declaring pull_request_target as this file's
    # only trigger (instead of alongside pull_request in pr-security.yml)
    # means an ordinary pull_request run on the source repository never
    # creates a skipped scan-self job on the pull request's head commit,
    # which would otherwise satisfy a required "scan-self" check trivially.
    # The pull request's content is checked out strictly as scan input
    # below: no secrets are exposed to it, and nothing from it is executed,
    # only statically analyzed. This property is structural and cannot be
    # exercised by a pull request against itself; it takes effect once this
    # job definition is on the base branch. Keep this job's scanner and
    # enforcement steps in sync with pr-security.yml's scan job.
    if: github.repository == 'dceoy/segh'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out trusted scanner configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _segh
          persist-credentials: false
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _target
          persist-credentials: false
          # This pull_request_target job never exposes secrets or executes
          # anything from the checked-out tree; it only runs static
          # analysis over it as scanner input. actions/checkout v7 refuses
          # to check out a fork PR's head SHA under pull_request_target by
          # default, so fork contributions would otherwise never reach the
          # scanners below.
          allow-unsafe-pr-checkout: true
      - name: Install checksum-verified scanners
        uses: aquaproj/aqua-installer@a78671ff723534c879a9c8aa62c99a3a05dddb49 # v4.0.5
        with:
          aqua_version: v2.62.1
          working_directory: _segh
      - name: Prepare report directory
        run: mkdir -p security-results
      - name: Run zizmor gate
        working-directory: _target
        run: |
          set +e
          zizmor \
            --offline \
            --no-config \
            --strict-collection \
            --persona regular \
            --min-severity medium \
            --min-confidence high \
            --format json \
            . > "$GITHUB_WORKSPACE/security-results/zizmor.json"
          status=$?
          zizmor \
            --offline \
            --no-config \
            --strict-collection \
            --persona regular \
            --min-severity medium \
            --min-confidence high \
            --no-exit-codes \
            --format plain \
            --color never \
            --render-links never \
            --show-audit-urls always \
            . > "$GITHUB_WORKSPACE/security-results/zizmor.txt" 2>&1
          render_status=$?
          if (( render_status != 0 )); then
            status=$render_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/zizmor.status"
      - name: Run Trivy misconfiguration gate
        if: always()
        working-directory: _target
        run: |
          set +e
          trivy fs \
            --config /dev/null \
            --ignorefile /dev/null \
            --scanners misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.json" \
            --skip-dirs .git \
            --skip-check-update \
            --skip-version-check \
            . 2> "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.log"
          status=$?
          trivy convert \
            --config /dev/null \
            --scanners misconfig \
            --format table \
            --output "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.txt" \
            "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.json"
          convert_status=$?
          if (( status == 0 && convert_status != 0 )); then
            status=$convert_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.status"
      - name: Run Trivy vulnerability gate
        if: always()
        working-directory: _target
        run: |
          set +e
          trivy fs \
            --config /dev/null \
            --ignorefile /dev/null \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.json" \
            --skip-dirs .git \
            --skip-version-check \
            . 2> "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.log"
          status=$?
          trivy convert \
            --config /dev/null \
            --scanners vuln \
            --format table \
            --output "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.txt" \
            "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.json"
          convert_status=$?
          if (( status == 0 && convert_status != 0 )); then
            status=$convert_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.status"
      - name: Run Trivy secret gate
        if: always()
        working-directory: _target
        run: |
          set +e
          trivy fs \
            --config /dev/null \
            --ignorefile /dev/null \
            --secret-config "$GITHUB_WORKSPACE/_segh/.github/security/trivy-secret.yaml" \
            --scanners secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$GITHUB_WORKSPACE/security-results/trivy-secret.json" \
            --skip-dirs .git \
            --skip-version-check \
            . 2> "$GITHUB_WORKSPACE/security-results/trivy-secret.log"
          status=$?
          trivy convert \
            --config /dev/null \
            --scanners secret \
            --format table \
            --output "$GITHUB_WORKSPACE/security-results/trivy-secret.txt" \
            "$GITHUB_WORKSPACE/security-results/trivy-secret.json"
          convert_status=$?
          if (( status == 0 && convert_status != 0 )); then
            status=$convert_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/trivy-secret.status"
      - name: Publish scanner summary
        if: always()
        run: |
          for scanner in zizmor trivy-misconfiguration trivy-vulnerability trivy-secret; do
            {
              printf '## %s\n\n' "$scanner"
              if [[ -f "security-results/$scanner.txt" ]]; then
                printf '```\n'
                sed -n '1,200p' "security-results/$scanner.txt"
                printf '```\n\n'
              else
                printf 'No human-readable report was produced. See the retained logs.\n\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Retain scanner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-security-reports
          path: security-results
          if-no-files-found: error
          retention-days: 14
      - name: Enforce scanner gates
        if: always()
        run: |
          failed=0
          for scanner in zizmor trivy-misconfiguration trivy-vulnerability trivy-secret; do
            status_file="security-results/$scanner.status"
            if [[ ! -f "$status_file" ]]; then
              echo "::error::$scanner did not produce a status"
              failed=1
              continue
            fi
            status=$(<"$status_file")
            if [[ ! "$status" =~ ^[0-9]+$ ]] || (( status != 0 )); then
              echo "::error::$scanner gate failed with status $status"
              failed=1
            fi
          done
          exit "$failed"

  publish-self-check:
    # GITHUB_SHA for pull_request_target is the base branch's commit, not the
    # pull request's head, so the check run GitHub creates automatically for
    # scan-self does not attach to the commit branch protection evaluates.
    # This job runs after scan-self completes (so its single-shot result is
    # already known) and publishes an explicit check run pinned to
    # github.event.pull_request.head.sha, so the gate can actually be
    # required for this repository. It never checks out or runs anything
    # from pull-request content.
    #
    # It must not publish with github.token: that token's identity is the
    # shared default "GitHub Actions" App, indistinguishable from the token
    # any other workflow in this repository also gets. A same-repository
    # pull request can add an ordinary pull_request-triggered job with
    # checks:write and forge a successful "segh source scan (head commit)"
    # run on its own head SHA with that same identity, and repository
    # secrets are no protection either: pull_request (unlike pull_request_target)
    # exposes them to same-repository pull requests too. The publisher
    # identity instead comes from a dedicated GitHub App token minted here,
    # gated by the self-scan-publisher environment's deployment-branch policy
    # (restricted to the base branch only). pull_request_target runs with
    # github.ref set to that base branch, so this job can obtain the
    # environment secrets; an ordinary pull_request job runs against an
    # ephemeral merge ref that never matches the policy, so GitHub refuses it
    # the same secrets before it can mint a token. Require the published
    # check to come from this dedicated App's ID, not just its name, so a
    # forged same-named check from the default App identity cannot satisfy
    # it either. See docs/workflows.md for the one-time rollout steps this
    # depends on (App creation, environment policy, required-check App
    # pinning).
    needs: scan-self
    if: always() && needs.scan-self.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: self-scan-publisher
    permissions:
      contents: read
    steps:
      - name: Create dedicated publisher App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_SCAN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.SEGH_SCAN_PUBLISHER_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-metadata: read
      - name: Publish the gate result on the pull request's head commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          conclusion=failure
          if [[ "${{ needs.scan-self.result }}" == "success" ]]; then
            conclusion=success
          fi
          gh api "repos/${{ github.repository }}/check-runs" \
            -f "name=segh source scan (head commit)" \
            -f "head_sha=${{ github.event.pull_request.head.sha }}" \
            -f "status=completed" \
            -f "conclusion=$conclusion"
