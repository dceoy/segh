---
name: Organization security dashboard

on:
  workflow_call:
    inputs:
      repository_limit:
        description: Maximum accepted GitHub App repository selection
        required: false
        type: string
        default: "50"
      max_parallel:
        description: Maximum number of repository scans to run concurrently
        required: false
        type: string
        default: "4"
      stale_after_hours:
        description: Maximum age of the last completed scan before a dashboard is stale
        required: false
        type: string
        default: "192"
    secrets:
      SEGH_ORG_SCAN_APP_ID:
        required: true
      SEGH_ORG_SCAN_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      repository_limit:
        description: Maximum accepted GitHub App repository selection
        required: false
        type: string
        default: "50"
      max_parallel:
        description: Maximum number of repository scans to run concurrently
        required: false
        type: string
        default: "4"
      stale_after_hours:
        description: Maximum age of the last completed scan before a dashboard is stale
        required: false
        type: string
        default: "192"
  schedule:
    - cron: "17 3 * * 0"

permissions: {}

concurrency:
  group: segh-organization-security-dashboard-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'schedule' || github.event.repository.private
    permissions:
      actions: read
      contents: read
      checks: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/organization-scan.yml
    with:
      repository_limit: ${{ inputs.repository_limit || '50' }}
      max_parallel: ${{ inputs.max_parallel || '4' }}
      dashboard_publication: deferred
    secrets:
      SEGH_ORG_SCAN_APP_ID: ${{ secrets.SEGH_ORG_SCAN_APP_ID }}
      SEGH_ORG_SCAN_APP_PRIVATE_KEY: ${{ secrets.SEGH_ORG_SCAN_APP_PRIVATE_KEY }}

  selection:
    if: github.event_name != 'schedule' || github.event.repository.private
    permissions: {}
    uses: ./.github/workflows/organization-selection.yml
    with:
      repository_limit: ${{ inputs.repository_limit || '50' }}
    secrets:
      SEGH_ORG_SCAN_APP_ID: ${{ secrets.SEGH_ORG_SCAN_APP_ID }}
      SEGH_ORG_SCAN_APP_PRIVATE_KEY: ${{ secrets.SEGH_ORG_SCAN_APP_PRIVATE_KEY }}

  reconcile:
    if: >-
      always() &&
      (github.event_name != 'schedule' || github.event.repository.private)
    needs:
      - scan
      - selection
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/dashboard-reconcile.yml
    with:
      stale_after_hours: ${{ inputs.stale_after_hours || '192' }}
      scan_result: ${{ needs.scan.result }}
