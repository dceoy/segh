---
name: Organization security audit and source scan
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: segh-organization-audit
  cancel-in-progress: false
jobs:
  audit:
    outputs:
      scan-enabled: ${{ steps.scan-outputs.outputs.enabled }}
      scan-matrix: ${{ steps.scan-outputs.outputs.matrix }}
      scan-concurrency: ${{ steps.scan-outputs.outputs.concurrency }}
      scan-targets: ${{ steps.scan-outputs.outputs.targets }}
      source-commit: ${{ steps.source.outputs.commit }}
    runs-on: ubuntu-24.04
    # Budgeted for two sequential inventory.timeout-bounded phases (segh
    # audit, then segh scan-plan) plus checkout/build/evidence-retention
    # overhead. inventory.timeout is capped at 30m by config validation, so
    # the worst case (2 * 30m + overhead) stays within this limit.
    timeout-minutes: 75
    steps:
      - name: Check out control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          path: _control
          persist-credentials: false
      - name: Validate control platform and source pin
        id: source
        env:
          CONTROL_SERVER_URL: ${{ github.server_url }}
        run: |
          if [[ "$CONTROL_SERVER_URL" != "https://github.com" ]]; then
            echo "::error::The supplied organization-audit workflow supports GitHub.com control repositories only. Adapt it to a protected same-host source mirror before using it on GHES."
            exit 1
          fi
          source_commit_file="_control/config/segh-source-commit"
          if [[ ! -f "$source_commit_file" ]]; then
            echo "::error::Create $source_commit_file with a reviewed dceoy/segh commit from protected main."
            exit 1
          fi
          source_commit=$(<"$source_commit_file")
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$source_commit_file must contain exactly one lowercase 40-character commit SHA."
            exit 1
          fi
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Check out trusted segh source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: dceoy/segh
          ref: ${{ steps.source.outputs.commit }}
          path: _segh
          persist-credentials: false
          fetch-depth: 0
      - name: Verify segh source is on protected main
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        working-directory: _segh
        run: |
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main; then
            echo "::error::The pinned segh source commit is not reachable from dceoy/segh protected main."
            exit 1
          fi
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_READ_APP_ID }}
          private-key: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}
          # Organization-wide inventory requires every repository in the App
          # installation; the permissions below still constrain the token to
          # the exact read-only API surface used by segh.
          owner: ${{ github.repository_owner }}   # zizmor: ignore[github-app]
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-metadata: read
          permission-organization-administration: read
      - name: Require a private control repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]]; then
            echo "::error::Organization security inventory is sensitive. Run this workflow only from a private control repository."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: _segh/go.sum
      - name: Build
        working-directory: _segh
        run: go build -trimpath -o "$GITHUB_WORKSPACE/bin/segh" ./cmd/segh
      - name: Audit GitHub-native governance
        id: governance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SEGH_GITHUB_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: bin/segh audit --config _control/config/organization.yaml
      - name: Refresh read-only GitHub App token before source scan planning
        id: scan-plan-token
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_READ_APP_ID }}
          private-key: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}   # zizmor: ignore[github-app]
          permission-contents: read
          permission-metadata: read
      - name: Resolve immutable source scan targets
        id: scan-plan
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.scan-plan-token.outputs.token }}
        run: |
          bin/segh scan-plan \
            --config _control/config/organization.yaml \
            --inventory segh-results/inventory.json
      - name: Export bounded source scan matrix
        id: scan-outputs
        if: always()
        run: |
          if [[ ! -f segh-results/scan-manifest.json ]]; then
            {
              echo 'enabled=false'
              echo 'matrix={"include":[]}'
              echo 'concurrency=1'
              echo 'targets=false'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          enabled=$(jq -r '.enabled' segh-results/scan-manifest.json)
          matrix=$(jq -c '
            {include: [.repositories[]
                | select(.scheduled)
                | {id, full_name, default_branch, commit_sha}]}
          ' segh-results/scan-manifest.json)
          concurrency=$(jq -r '.concurrency' segh-results/scan-manifest.json)
          targets=$(jq -r '[.repositories[] | select(.scheduled)] | length > 0' segh-results/scan-manifest.json)
          {
            printf 'enabled=%s\n' "$enabled"
            printf 'matrix=%s\n' "$matrix"
            printf 'concurrency=%s\n' "$concurrency"
            printf 'targets=%s\n' "$targets"
          } >> "$GITHUB_OUTPUT"
      - name: Publish operator summary
        if: always()
        run: |
          if [[ -f segh-results/report.md ]]; then
            cat segh-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: organization-governance-report
          path: |
            segh-results/inventory.json
            segh-results/audit.json
            segh-results/report.md
          if-no-files-found: warn
          retention-days: 14
      - name: Retain source scan plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: organization-source-scan-plan
          path: |
            segh-results/scan-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce governance and planning results
        if: always()
        env:
          GOVERNANCE_RESULT: ${{ steps.governance.outcome }}
          PLAN_RESULT: ${{ steps.scan-plan.outcome }}
        run: |
          failed=0
          if [[ "$GOVERNANCE_RESULT" != success ]]; then
            echo "::error::Governance audit result: $GOVERNANCE_RESULT"
            failed=1
          fi
          if [[ "$PLAN_RESULT" != success ]]; then
            echo "::error::Source scan planning result: $PLAN_RESULT"
            failed=1
          fi
          exit "$failed"

  source-scan:
    name: Source scan / ${{ matrix.full_name }}
    needs: audit
    if: always() && needs.audit.outputs.source-commit != '' && needs.audit.outputs.scan-enabled == 'true' && needs.audit.outputs.scan-targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.audit.outputs.scan-concurrency) }}
      matrix: ${{ fromJSON(needs.audit.outputs.scan-matrix) }}
    permissions:
      contents: read
    # Pinned dceoy/gha-for-devops commit: owns target checkout, token
    # minting, scanner installation and invocation, exit-code and
    # evidence-shape classification, identity-bound status.json generation,
    # and per-repository artifact publication. segh supplies only the
    # planned target identity and a unique evidence artifact name.
    uses: dceoy/gha-for-devops/.github/workflows/repository-security-scan.yml@c84ceed28723b5cd5a93edb1febdfaad39e7c522
    with:
      target-repository: ${{ matrix.full_name }}
      target-ref: ${{ matrix.commit_sha }}
      repository-id: ${{ matrix.id }}
      default-branch: ${{ matrix.default_branch }}
      evidence-artifact-name: repository-scan-${{ matrix.id }}
    secrets:
      TARGET_APP_CLIENT_ID: ${{ secrets.SEGH_READ_APP_CLIENT_ID }}
      TARGET_APP_PRIVATE_KEY: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}

  source-scan-summary:
    name: Organization source scan summary
    needs: [audit, source-scan]
    if: always() && needs.audit.outputs.source-commit != '' && needs.audit.outputs.scan-enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted segh source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: dceoy/segh
          ref: ${{ needs.audit.outputs.source-commit }}
          path: _segh
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: _segh/go.sum
      - name: Build trusted summarizer
        working-directory: _segh
        run: go build -trimpath -o "$GITHUB_WORKSPACE/bin/segh" ./cmd/segh
      - name: Download source scan plan
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: organization-source-scan-plan
          path: segh-results
      - name: Download repository scan evidence
        if: needs.audit.outputs.scan-targets == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          pattern: repository-scan-*
          path: repository-scans
      - name: Aggregate source scan evidence
        id: summarize
        continue-on-error: true
        run: |
          mkdir -p repository-scans
          bin/segh scan-summary \
            --manifest segh-results/scan-manifest.json \
            --results repository-scans
      - name: Publish bounded source scan summary
        if: always()
        run: |
          if [[ -f segh-results/scan-report.md ]]; then
            cat segh-results/scan-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain complete private source scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: organization-source-scan-evidence
          path: |
            segh-results/scan-manifest.json
            segh-results/scan-summary.json
            segh-results/scan-report.md
            repository-scans
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce aggregate source scan result
        if: always()
        env:
          MATRIX_RESULT: ${{ needs.source-scan.result }}
          SUMMARY_RESULT: ${{ steps.summarize.outcome }}
          HAS_TARGETS: ${{ needs.audit.outputs.scan-targets }}
        run: |
          if [[ "$SUMMARY_RESULT" != success ]]; then
            echo "::error::Source scan summary result: $SUMMARY_RESULT"
            exit 1
          fi
          if [[ "$HAS_TARGETS" == true && "$MATRIX_RESULT" != success ]]; then
            echo "::error::Repository source scan matrix result: $MATRIX_RESULT"
            exit 1
          fi
