name: Organization security audit

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inventory and plan without cloning or publishing
        required: false
        default: true
        type: boolean
      repositories:
        description: Optional comma-separated exact owner/repository targets
        required: false
        type: string
      batch_size:
        description: Repositories per isolated matrix job
        required: false
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: segh-organization-audit
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Require a private control repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]]; then
            echo "::error::This workflow retains the organization inventory, audit, and scanner findings in Actions artifacts and the run summary, which are readable by anyone with repository read access. Run it only from a private control repository; $GITHUB_REPOSITORY is not private."
            exit 1
          fi
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build
        run: go build -trimpath -o bin/segh ./cmd/segh
      - name: Inventory
        id: inventory
        env:
          SEGH_GITHUB_APP_ID: ${{ secrets.SEGH_READ_APP_ID }}
          SEGH_GITHUB_INSTALLATION_ID: ${{ secrets.SEGH_READ_INSTALLATION_ID }}
          SEGH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}
        run: |
          set +e
          bin/segh --config config/organization.yaml inventory \
            --output segh-results/inventory.json
          status=$?
          set -e
          case "$status" in
            0)
              printf 'complete=true\n' >> "$GITHUB_OUTPUT"
              ;;
            4)
              printf 'complete=false\n' >> "$GITHUB_OUTPUT"
              echo "::warning::Inventory is incomplete; retaining the partial evidence and skipping repository scans."
              ;;
            *)
              exit "$status"
              ;;
          esac
      - name: Audit policy
        run: |
          set +e
          bin/segh --config config/organization.yaml audit \
            --inventory segh-results/inventory.json \
            --output segh-results/audit.json \
            --markdown segh-results/audit.md
          status=$?
          if (( status != 0 && status != 1 && status != 4 )); then
            exit "$status"
          fi
      - name: Create deterministic batches
        id: matrix
        if: ${{ steps.inventory.outputs.complete == 'true' }}
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '25' }}
          TARGET_REPOSITORIES: ${{ inputs.repositories }}
        run: |
          args=()
          if test -n "$TARGET_REPOSITORIES"; then
            IFS=',' read -ra repositories <<< "$TARGET_REPOSITORIES"
            for repository in "${repositories[@]}"; do
              args+=(--repository "$repository")
            done
          fi
          bin/segh --config config/organization.yaml batch \
            --inventory segh-results/inventory.json \
            --size "$BATCH_SIZE" \
            --output-directory segh-results/batches \
            --matrix segh-results/batches/matrix.json \
            "${args[@]}"
          if jq -e '.include | length > 0' segh-results/batches/matrix.json > /dev/null; then
            {
              printf 'matrix='
              tr -d '\n' < segh-results/batches/matrix.json
              printf '\n'
            } >> "$GITHUB_OUTPUT"
          else
            printf 'matrix=\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-plan
          path: segh-results
          if-no-files-found: error
          retention-days: 14

  scan:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BATCH: ${{ matrix.batch }}
      BATCH_INVENTORY: ${{ matrix.inventory }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install checksum-verified scanners
        uses: aquaproj/aqua-installer@a78671ff723534c879a9c8aa62c99a3a05dddb49 # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: organization-plan
          path: segh-results
      - name: Build
        run: go build -trimpath -o bin/segh ./cmd/segh
      - name: Scan isolated batch
        env:
          SEGH_GITHUB_APP_ID: ${{ secrets.SEGH_READ_APP_ID }}
          SEGH_GITHUB_INSTALLATION_ID: ${{ secrets.SEGH_READ_INSTALLATION_ID }}
          SEGH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}
        run: |
          set +e
          bin/segh --config config/organization.yaml scan \
            --inventory "segh-results/batches/$BATCH_INVENTORY" \
            --run-id "$GITHUB_RUN_ID" \
            --dry-run="$DRY_RUN" \
            --output "segh-results/batch-$BATCH/scan.json" \
            --output-directory "segh-results/batch-$BATCH"
          status=$?
          if (( status > 1 )); then
            exit "$status"
          fi
      - name: Retain batch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ matrix.batch }}
          path: segh-results/batch-${{ matrix.batch }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, scan]
    if: ${{ always() && inputs.dry_run != true && needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BATCH: ${{ matrix.batch }}
      BATCH_INVENTORY: ${{ matrix.inventory }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: organization-plan
          path: segh-results
      - name: Download batch SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-${{ matrix.batch }}
          path: segh-results/batch-${{ matrix.batch }}
      - name: Build trusted publisher
        run: go build -trimpath -o bin/segh ./cmd/segh
      - name: Publish batch SARIF
        env:
          SEGH_GITHUB_APP_ID: ${{ secrets.SEGH_PUBLISH_APP_ID }}
          SEGH_GITHUB_INSTALLATION_ID: ${{ secrets.SEGH_PUBLISH_INSTALLATION_ID }}
          SEGH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SEGH_PUBLISH_APP_PRIVATE_KEY }}
        run: |
          bin/segh --config config/organization.yaml publish \
            --scan "segh-results/batch-$BATCH/scan.json" \
            --inventory "segh-results/batches/$BATCH_INVENTORY" \
            --output "segh-results/batch-$BATCH/publications.json"
      - name: Retain publication status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ matrix.batch }}
          path: segh-results/batch-${{ matrix.batch }}/publications.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: [plan, scan, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a private control repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]]; then
            echo "::error::This workflow retains the organization inventory, audit, and scanner findings in Actions artifacts and the run summary, which are readable by anyone with repository read access. Run it only from a private control repository; $GITHUB_REPOSITORY is not private."
            exit 1
          fi
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: organization-plan
          path: segh-results
      - name: Download available batch results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-*
          path: batch-results
      - name: Download available publication results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publication-*
          path: publication-results
      - name: Build and aggregate
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          go build -trimpath -o bin/segh ./cmd/segh
          scan_args=()
          if test -d batch-results && test -n "$(find batch-results -name scan.json -print -quit)"; then
            bin/segh --config config/organization.yaml merge \
              --scan batch-results \
              --output segh-results/scan-merged.json
            scan_args+=(--scan segh-results/scan-merged.json)
          fi
          publication_args=()
          if test -d publication-results && test -n "$(find publication-results -name publications.json -print -quit)"; then
            publication_args+=(--publications publication-results)
          fi
          # Expected coverage comes from the batch plan rather than the
          # organization inventory's selected count, since a workflow_dispatch
          # run can target a repository subset that is smaller than the
          # inventory: comparing against the inventory would misreport such a
          # run as partial even when every planned batch succeeded.
          expected_repositories=0
          if test -n "$(find segh-results/batches -maxdepth 1 -name 'inventory-*.json' -print -quit 2>/dev/null)"; then
            expected_repositories=$(jq -s '[.[].repositories[].full_name] | unique | length' segh-results/batches/inventory-*.json)
          fi
          expected_publication_batches=-1
          if [[ "$DRY_RUN" != "true" ]] && test -f segh-results/batches/matrix.json; then
            expected_publication_batches=$(jq '.include | length' segh-results/batches/matrix.json)
          fi
          bin/segh --config config/organization.yaml report \
            --inventory segh-results/inventory.json \
            --audit segh-results/audit.json \
            --expected-repositories "$expected_repositories" \
            --expected-publication-batches "$expected_publication_batches" \
            "${scan_args[@]}" \
            "${publication_args[@]}" \
            --output segh-results/report.json \
            --markdown segh-results/report.md
          cat segh-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain consolidated report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-report
          path: |
            segh-results/report.json
            segh-results/report.md
            segh-results/inventory.json
            segh-results/audit.json
            segh-results/scan-merged.json
          if-no-files-found: warn
          retention-days: 14
