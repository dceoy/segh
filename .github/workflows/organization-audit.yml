name: Organization security governance audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segh-organization-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_READ_APP_ID }}
          private-key: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}
          # Organization-wide inventory requires every repository in the App
          # installation; the permissions below still constrain the token to
          # the exact read-only API surface used by segh.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-metadata: read
          permission-organization-administration: read
          permission-repository-custom-properties: read
          permission-security-events: read
          permission-vulnerability-alerts: read
      - name: Require a private control repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]]; then
            echo "::error::Organization security inventory is sensitive. Run this workflow only from a private control repository."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build
        run: go build -trimpath -o bin/segh ./cmd/segh
      - name: Inventory GitHub-native controls
        id: inventory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SEGH_GITHUB_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          set +e
          bin/segh --config config/organization.yaml inventory \
            --output segh-results/inventory.json
          status=$?
          if (( status != 0 && status != 4 )); then
            exit "$status"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Evaluate policy
        id: audit
        if: always() && steps.inventory.outcome == 'success'
        run: |
          set +e
          bin/segh --config config/organization.yaml audit \
            --inventory segh-results/inventory.json \
            --output segh-results/audit.json
          status=$?
          if (( status != 0 && status != 1 && status != 4 )); then
            exit "$status"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Build deterministic report
        if: always() && steps.audit.outcome == 'success'
        run: |
          set +e
          bin/segh --config config/organization.yaml report \
            --inventory segh-results/inventory.json \
            --audit segh-results/audit.json \
            --output segh-results/report.json \
            --markdown segh-results/report.md
          status=$?
          cat segh-results/report.md >> "$GITHUB_STEP_SUMMARY"
          if (( status != 0 && status != 1 && status != 4 )); then
            exit "$status"
          fi
          if (( status != 0 )); then
            echo "::error::Governance audit completed with policy violations or incomplete coverage (exit $status)."
            exit "$status"
          fi
      - name: Retain governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-governance-report
          path: segh-results
          if-no-files-found: warn
          retention-days: 14
