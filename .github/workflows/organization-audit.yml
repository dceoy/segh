---
name: Organization security governance audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: segh-organization-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          path: _control
          persist-credentials: false
      - name: Validate control platform and source pin
        id: source
        env:
          CONTROL_SERVER_URL: ${{ github.server_url }}
        run: |
          if [[ "$CONTROL_SERVER_URL" != "https://github.com" ]]; then
            echo "::error::The supplied organization-audit workflow supports GitHub.com control repositories only. Adapt it to a protected same-host source mirror before using it on GHES."
            exit 1
          fi
          source_commit_file="_control/config/segh-source-commit"
          if [[ ! -f "$source_commit_file" ]]; then
            echo "::error::Create $source_commit_file with a reviewed dceoy/segh commit from protected main."
            exit 1
          fi
          source_commit=$(<"$source_commit_file")
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$source_commit_file must contain exactly one lowercase 40-character commit SHA."
            exit 1
          fi
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Check out trusted segh source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: dceoy/segh
          ref: ${{ steps.source.outputs.commit }}
          path: _segh
          persist-credentials: false
          fetch-depth: 0
      - name: Verify segh source is on protected main
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        working-directory: _segh
        run: |
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main; then
            echo "::error::The pinned segh source commit is not reachable from dceoy/segh protected main."
            exit 1
          fi
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_READ_APP_ID }}
          private-key: ${{ secrets.SEGH_READ_APP_PRIVATE_KEY }}
          # Organization-wide inventory requires every repository in the App
          # installation; the permissions below still constrain the token to
          # the exact read-only API surface used by segh.
          owner: ${{ github.repository_owner }}   # zizmor: ignore[github-app]
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-metadata: read
          permission-organization-administration: read
          permission-organization-custom-properties: read
      - name: Require a private control repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]]; then
            echo "::error::Organization security inventory is sensitive. Run this workflow only from a private control repository."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: _segh/go.sum
      - name: Build
        working-directory: _segh
        run: go build -trimpath -o "$GITHUB_WORKSPACE/bin/segh" ./cmd/segh
      - name: Audit GitHub-native governance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SEGH_GITHUB_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: bin/segh audit --config _control/config/organization.yaml
      - name: Publish operator summary
        if: always()
        run: |
          if [[ -f segh-results/report.md ]]; then
            cat segh-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: organization-governance-report
          path: segh-results
          if-no-files-found: warn
          retention-days: 14
