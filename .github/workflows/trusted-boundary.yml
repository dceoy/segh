---
name: Trusted workflow-only boundary

# Configure this check as required after the bootstrap merge.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main

permissions: {}

jobs:
  trusted-workflow-only-boundary:
    name: Trusted workflow-only boundary
    if: github.repository == 'dceoy/segh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _trusted
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _candidate
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Protect the trusted policy source
        shell: bash
        run: |
          set -euo pipefail
          compare_trusted_entry() {
            local path=$1
            local trusted_entry candidate_entry
            trusted_entry=$(git -C _trusted ls-tree HEAD -- "$path")
            candidate_entry=$(git -C _candidate ls-tree HEAD -- "$path")
            if [[ -z "$trusted_entry" || "$candidate_entry" != "$trusted_entry" ]]; then
              echo "::error file=$path::The trusted policy source cannot be changed by an ordinary pull request."
              return 1
            fi
          }
          compare_trusted_entry .github/workflows/trusted-boundary.yml
          compare_trusted_entry scripts/validate-workflow-boundary.rb
      - name: Validate candidate product boundary
        run: ruby _trusted/scripts/validate-workflow-boundary.rb _candidate
