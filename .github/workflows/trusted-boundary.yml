---
name: Trusted workflow-only boundary

# This base-sourced workflow validates ordinary pull requests with policy loaded
# from the protected base revision. Its native job check is the required result.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main

permissions: {}

jobs:
  trusted-workflow-only-boundary:
    name: Trusted workflow-only boundary
    if: github.repository == 'dceoy/segh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted base revision
        id: trusted-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _trusted
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check out candidate revision
        id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: _candidate
          persist-credentials: false
          lfs: false
          submodules: false
          allow-unsafe-pr-checkout: true
      - name: Protect trusted policy sources and executable workflow structure
        id: trusted-policy
        shell: bash
        run: |
          set -euo pipefail
          compare_trusted_entry() {
            local path=$1
            local trusted_entry candidate_entry
            trusted_entry=$(git -C _trusted ls-tree HEAD -- "$path")
            candidate_entry=$(git -C _candidate ls-tree HEAD -- "$path")
            if [[ -z "$trusted_entry" || "$candidate_entry" != "$trusted_entry" ]]; then
              echo "::error file=$path::The trusted policy source cannot be changed by an ordinary pull request."
              return 1
            fi
          }
          compare_trusted_entry .github/workflows/trusted-boundary.yml
          compare_trusted_entry scripts/preflight.sh
          compare_trusted_entry scripts/validate-workflow-boundary.rb

          ruby <<'RUBY'
          require "yaml"

          WORKFLOWS = [
            ".github/workflows/dashboard-reconcile.yml",
            ".github/workflows/organization-dashboard.yml",
            ".github/workflows/organization-scan.yml",
            ".github/workflows/organization-selection.yml",
            ".github/workflows/validation.yml"
          ].freeze

          def tracked_tree_shape(root)
            content = IO.popen(["git", "-C", root, "ls-tree", "-rz", "HEAD"], &:read)
            abort("::error::Unable to read the tracked Git tree.") unless $?.success?

            content.split("\0").filter_map do |entry|
              next if entry.empty?

              metadata, path = entry.split("\t", 2)
              mode, type, = metadata.to_s.split
              [path, mode, type]
            end.sort
          end

          def tracked_workflow(root, path)
            content = IO.popen(["git", "-C", root, "show", "HEAD:#{path}"], &:read)
            abort("::error file=#{path}::Unable to read the tracked workflow blob.") unless $?.success?

            YAML.safe_load(content, aliases: false, filename: path)
          rescue Psych::Exception => e
            abort("::error file=#{path}::Invalid YAML: #{e.message.lines.first&.strip}")
          end

          def normalize_workflow(node)
            case node
            when Hash
              node.to_h do |key, value|
                normalized = normalize_workflow(value)
                if key == "uses" && normalized.is_a?(String) && !normalized.start_with?("./")
                  match = /\A([^@\s]+)@[0-9a-f]{40}\z/.match(normalized)
                  normalized = "#{match[1]}@<full-sha>" if match
                end
                [key, normalized]
              end
            when Array
              node.map { |value| normalize_workflow(value) }
            else
              node
            end
          end

          unless tracked_tree_shape("_candidate") == tracked_tree_shape("_trusted")
            abort("::error::Tracked path, object type, and file-mode set must match the trusted base revision.")
          end

          WORKFLOWS.each do |path|
            trusted = normalize_workflow(tracked_workflow("_trusted", path))
            candidate = normalize_workflow(tracked_workflow("_candidate", path))
            next if candidate == trusted

            abort("::error file=#{path}::The security-sensitive workflow structure must match the trusted base implementation; only reviewed full-SHA action pin updates are allowed.")
          end
          RUBY
      - name: Validate candidate product boundary
        id: candidate-boundary
        run: ruby _trusted/scripts/validate-workflow-boundary.rb _candidate
