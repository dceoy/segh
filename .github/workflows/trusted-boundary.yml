---
name: Trusted workflow-only boundary

# Configure this check as required after the bootstrap merge.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main

permissions: {}

jobs:
  trusted-workflow-only-boundary:
    name: Trusted workflow-only boundary
    if: github.repository == 'dceoy/segh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _trusted
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: _candidate
          persist-credentials: false
          lfs: false
          submodules: false
          allow-unsafe-pr-checkout: true
      - name: Protect trusted policy sources and command surface
        shell: bash
        run: |
          set -euo pipefail
          compare_trusted_entry() {
            local path=$1
            local trusted_entry candidate_entry
            trusted_entry=$(git -C _trusted ls-tree HEAD -- "$path")
            candidate_entry=$(git -C _candidate ls-tree HEAD -- "$path")
            if [[ -z "$trusted_entry" || "$candidate_entry" != "$trusted_entry" ]]; then
              echo "::error file=$path::The trusted policy source cannot be changed by an ordinary pull request."
              return 1
            fi
          }
          compare_trusted_entry .github/workflows/trusted-boundary.yml
          compare_trusted_entry scripts/validate-workflow-boundary.rb

          ruby <<'RUBY'
          require "yaml"

          def tracked_workflow(root)
            path = ".github/workflows/organization-scan.yml"
            content = IO.popen(["git", "-C", root, "show", "HEAD:#{path}"], &:read)
            abort("::error file=#{path}::Unable to read the tracked workflow blob.") unless $?.success?

            YAML.safe_load(content, aliases: false, filename: path)
          rescue Psych::Exception => e
            abort("::error file=#{path}::Invalid YAML: #{e.message.lines.first&.strip}")
          end

          def run_surface(node, path = [], result = {})
            case node
            when Hash
              node.each do |key, value|
                current = path + [key]
                if key == "run"
                  abort("::error file=.github/workflows/organization-scan.yml::Every run node must be a string.") unless value.is_a?(String)
                  result[current] = value
                else
                  run_surface(value, current, result)
                end
              end
            when Array
              node.each_with_index { |value, index| run_surface(value, path + [index], result) }
            end
            result
          end

          trusted = run_surface(tracked_workflow("_trusted"))
          candidate = run_surface(tracked_workflow("_candidate"))
          unless candidate == trusted
            abort("::error file=.github/workflows/organization-scan.yml::The executable command surface must match the trusted base implementation.")
          end
          RUBY
      - name: Validate candidate product boundary
        run: ruby _trusted/scripts/validate-workflow-boundary.rb _candidate
