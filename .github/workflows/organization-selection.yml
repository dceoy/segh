---
name: Organization selection snapshot

on:
  workflow_call:
    inputs:
      repository_limit:
        description: Maximum accepted GitHub App repository selection for complete reconciliation
        required: false
        type: string
        default: "50"
    secrets:
      SEGH_ORG_SCAN_APP_ID:
        required: true
      SEGH_ORG_SCAN_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require a private control repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != true ]]; then
            echo "::error::Organization selection snapshots may contain private repository identities and require a private control repository."
            exit 1
          fi
      - name: Create installation read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEGH_ORG_SCAN_APP_ID }}
          private-key: ${{ secrets.SEGH_ORG_SCAN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: read
          permission-metadata: read
      - name: Capture complete bounded App selection
        id: selection
        shell: bash
        env:
          SEGH_SELECTION_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY_LIMIT: ${{ inputs.repository_limit }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SEGH_SELECTION_TOKEN"
          export GH_TOKEN="$SEGH_SELECTION_TOKEN"

          if [[ ! "$REPOSITORY_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::repository_limit must be an integer from 1 to 100."
            exit 1
          fi
          repository_limit=$((10#$REPOSITORY_LIMIT))
          if ((repository_limit < 1 || repository_limit > 100)); then
            echo "::error::repository_limit must be an integer from 1 to 100."
            exit 1
          fi

          gh api --paginate --slurp /installation/repositories > repository-pages.json
          jq -e '
            . as $pages |
            ($pages | type == "array" and length > 0) and
            all($pages[];
              type == "object" and
              (.total_count | type == "number" and floor == . and . >= 0) and
              (.repositories | type == "array")
            ) and
            (($pages | map(.total_count) | unique | length) == 1) and
            (($pages | map(.repositories | length) | add) == $pages[0].total_count)
          ' repository-pages.json > /dev/null

          jq '[.[].repositories[]] as $repositories |
            if ($repositories | length) != ($repositories | map(.id) | unique | length)
            then error("duplicate repository IDs")
            else $repositories end |
            map({
              id,
              full_name,
              owner: .owner.login,
              name,
              visibility,
              fork,
              archived,
              disabled,
              default_branch,
              disposition: (if .archived == true or .disabled == true then "retired" else "active" end),
              reason: (
                if .archived == true and .disabled == true then "repository is archived and disabled"
                elif .archived == true then "repository is archived"
                elif .disabled == true then "repository is disabled"
                else "selected by the GitHub App installation"
                end
              )
            }) | sort_by(.id)' repository-pages.json > repositories.json

          jq -e '
            type == "array" and
            all(.[];
              (.id | type == "number" and floor == . and . > 0) and
              (.owner | type == "string" and length > 0 and (contains("/") | not)) and
              (.name | type == "string" and length > 0 and (contains("/") | not)) and
              (.full_name == (.owner + "/" + .name)) and
              (.visibility == "public" or .visibility == "private" or .visibility == "internal") and
              (.fork | type == "boolean") and
              (.archived | type == "boolean") and
              (.disabled | type == "boolean") and
              (.default_branch | type == "string" and length > 0) and
              (.disposition == "active" or .disposition == "retired") and
              (.reason | type == "string" and length > 0 and length <= 120)
            )
          ' repositories.json > /dev/null

          repository_count=$(jq 'length' repositories.json)
          if ((repository_count > repository_limit)); then
            echo "::error::GitHub App selection contains $repository_count repositories, exceeding repository_limit=$repository_limit; refusing incomplete reconciliation."
            exit 1
          fi

          jq -n --slurpfile repositories repositories.json '{repositories: $repositories[0]}' > selection.json
      - name: Retain bounded selection snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-selection-snapshot
          path: selection.json
          if-no-files-found: error
          retention-days: 1
