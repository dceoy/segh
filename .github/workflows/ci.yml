---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install checksum-verified tools
        uses: aquaproj/aqua-installer@a78671ff723534c879a9c8aa62c99a3a05dddb49  # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Validate configuration
        run: |
          go run ./cmd/segh audit --config segh.example.yaml --validate-only
          go run ./cmd/segh audit --config config/organization.yaml --validate-only
          jq empty schema/*.json config/*.json renovate.json aqua-checksums.json
      - name: Check formatting
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find cmd internal -name '*.go' -type f -print0)
          test -z "$(gofmt -l "${files[@]}")"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Lint
        run: |
          golangci-lint run
          actionlint
      - name: Build
        run: go build -trimpath -o bin/segh ./cmd/segh
