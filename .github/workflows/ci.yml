---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Some internal/workflows tests exec the repository-scan gate script with
      # their working directory set to an unrelated temporary directory, to
      # exercise real scanner binaries without touching this checkout. aqua's
      # shims resolve a pinned tool version by searching upward from the
      # invoking process's working directory for an aqua.yaml, independent
      # of PATH order, so without this they silently fall back to whatever
      # same-named binary happens to be preinstalled on the runner (e.g. an
      # older distro-packaged ShellCheck) instead of the version this
      # repository pins.
      AQUA_CONFIG: ${{ github.workspace }}/aqua.yaml
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install checksum-verified tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e  # v4.0.5
        with:
          aqua_version: v2.62.1
      - name: Validate configuration
        run: |
          go run ./cmd/segh audit --config segh.example.yaml --validate-only
          go run ./cmd/segh audit --config config/organization.yaml --validate-only
          jq empty schema/*.json config/*.json renovate.json aqua-checksums.json
      - name: Check formatting
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find cmd internal -name '*.go' -type f -print0)
          test -z "$(gofmt -l "${files[@]}")"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Lint
        run: |
          golangci-lint run
          actionlint
      - name: Build
        run: go build -trimpath -o bin/segh ./cmd/segh
