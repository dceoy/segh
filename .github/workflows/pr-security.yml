---
name: PR security
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  upstream:
    name: upstream repository security
    if: github.repository != 'dceoy/segh' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/repository-security-scan.yml@c84ceed28723b5cd5a93edb1febdfaad39e7c522

  scan:
    # Compatibility gate for organization rulesets that still require the
    # historical "PR security / scan" check. Generic scanner execution is
    # owned exclusively by the pinned gha-for-devops workflow above.
    # Remove this workflow only after an organization administrator adds the
    # pinned upstream required workflow alongside it, verifies clean/failing
    # PR and merge-group runs, and then removes this legacy requirement.
    name: scan
    needs: upstream
    if: always() && github.repository != 'dceoy/segh' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Preserve the existing required-check contract
        env:
          UPSTREAM_RESULT: ${{ needs.upstream.result }}
        run: |
          if [[ "$UPSTREAM_RESULT" != success ]]; then
            echo "::error::Pinned gha-for-devops repository security result: $UPSTREAM_RESULT"
            exit 1
          fi
