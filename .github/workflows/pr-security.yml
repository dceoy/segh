---
name: PR security
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  scan:
    # Organization rulesets run this workflow in target repositories, pinned
    # to a dceoy/segh commit (github.workflow_sha) that a target repository's
    # pull request cannot influence. The source repository's own enforcement
    # runs in the separate pr-security-self.yml instead: a pull_request_target
    # workflow whose definition always comes from the base branch, so a pull
    # request here cannot weaken the job that scans it, and whose trigger is
    # not declared here, so a pull_request run on the source repository never
    # emits a skippable scan-self check on the pull request's head commit.
    # Both wrappers invoke the same scanner pipeline from the trusted checkout.
    # merge_group is required so this workflow, once installed as an
    # organization ruleset required workflow, still produces the check a
    # target repository's merge queue needs to complete a queued merge;
    # without it, GitHub never creates "PR security / scan" for the
    # merge-group commit and the queue entry can never pass.
    if: github.repository != 'dceoy/segh' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # aqua's shims resolve a pinned tool version by searching upward from
      # the invoking process's working directory for an aqua.yaml, entirely
      # independent of PATH order. The trusted scanner script runs tools from
      # _target, the untrusted pull request checkout, so
      # without this a scanner invocation resolves against a pull-request-
      # controlled aqua.yaml if "_target" happens to have one (letting a
      # pull request choose the very tool version that scans it) or, absent
      # one, silently falls back to whatever same-named binary is next on
      # PATH, such as an older distro-packaged ShellCheck, rather than the
      # checksum-verified version pinned in this repository's aqua.yaml.
      # Pointing every scanner invocation at the trusted checkout's aqua.yaml
      # closes both gaps.
      AQUA_CONFIG: ${{ github.workspace }}/_segh/aqua.yaml
    steps:
      - name: Check out trusted scanner configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: dceoy/segh
          # pull_request (unlike pull_request_target) runs the workflow
          # version proposed by the pull request itself. For a same-repository
          # pull request, github.workflow_sha can therefore resolve to that
          # proposal, so a pull request that edits this scanner configuration
          # must not be allowed to also supply its own "trusted" checkout.
          # Pin to the pre-pull-request base commit here instead; target
          # repositories keep github.workflow_sha, which always names a
          # dceoy/segh commit unrelated to the repository being scanned.
          ref: ${{ github.repository == 'dceoy/segh' && github.event.pull_request.base.sha || github.workflow_sha }}
          path: _segh
          persist-credentials: false
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # merge_group has no github.event.pull_request; scan the merge
          # group's own head SHA instead, the synthetic commit the queue is
          # about to merge (which may combine more than one queued pull
          # request), since that is the actual untrusted content in play.
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          path: _target
          persist-credentials: false
      - name: Run trusted scanner pipeline
        uses: ./_segh/.github/actions/pr-security
  scorecard:
    # Scorecard is evidence only. Its action has platform limitations for some
    # private repositories, so rulesets must not require this job. Gated to
    # pull_request only so it doesn't double-run now that pull_request_target
    # is also a workflow trigger.
    if: github.repository != 'dceoy/segh' && github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare Scorecard output
        run: mkdir -p security-results
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: security-results/scorecard.json
          results_format: json
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: false
      - name: Retain Scorecard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-security-scorecard
          path: security-results/scorecard.json
          if-no-files-found: warn
          retention-days: 14
