name: PR security

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out trusted scanner configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dceoy/segh
          ref: ${{ github.workflow_sha }}
          path: _segh
          persist-credentials: false
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _target
          persist-credentials: false
      - name: Install checksum-verified scanners
        uses: aquaproj/aqua-installer@a78671ff723534c879a9c8aa62c99a3a05dddb49 # v4.0.5
        with:
          aqua_version: v2.62.1
          working_directory: _segh
      - name: Run zizmor
        id: zizmor
        working-directory: _target
        run: |
          mkdir -p ../security-results
          set +e
          zizmor --offline --no-config --strict-collection --format=sarif . > ../security-results/zizmor.sarif
          status=$?
          if (( status != 0 && status != 1 && status != 10 )); then
            exit "$status"
          fi
      - name: Run Trivy misconfiguration scan
        working-directory: _target
        run: |
          trivy fs \
            --scanners misconfig \
            --format sarif \
            --output "$GITHUB_WORKSPACE/security-results/trivy.sarif" \
            --skip-dirs .git \
            --skip-check-update \
            --skip-version-check \
            --offline-scan \
            .
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: security-results/scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: false
      - name: Retain raw SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-sarif-${{ github.event.pull_request.number }}
          path: security-results
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: scan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out analyzed revision for SARIF fingerprints
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _target
          persist-credentials: false
      - name: Download scanner SARIF
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-sarif-${{ github.event.pull_request.number }}
          path: security-results
      - name: Upload zizmor SARIF
        if: ${{ hashFiles('security-results/zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/zizmor.sarif
          checkout_path: _target
          category: zizmor
          wait-for-processing: true
      - name: Upload Trivy SARIF
        if: ${{ hashFiles('security-results/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/trivy.sarif
          checkout_path: _target
          category: trivy
          wait-for-processing: true
      - name: Upload Scorecard SARIF
        if: ${{ hashFiles('security-results/scorecard.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: security-results/scorecard.sarif
          checkout_path: _target
          category: scorecard
          wait-for-processing: true
