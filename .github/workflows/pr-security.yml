name: PR security

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  scan:
    # Organization rulesets run this workflow in target repositories, pinned
    # to a dceoy/segh commit (github.workflow_sha) that a target repository's
    # pull request cannot influence. The source repository's own enforcement
    # runs in the separate pr-security-self.yml instead: a pull_request_target
    # workflow whose definition always comes from the base branch, so a pull
    # request here cannot weaken the job that scans it, and whose trigger is
    # not declared here, so a pull_request run on the source repository never
    # emits a skippable scan-self check on the pull request's head commit.
    # Keep this job's scanner and enforcement steps in sync with scan-self's.
    # merge_group is required so this workflow, once installed as an
    # organization ruleset required workflow, still produces the check a
    # target repository's merge queue needs to complete a queued merge;
    # without it, GitHub never creates "PR security / scan" for the
    # merge-group commit and the queue entry can never pass.
    if: github.repository != 'dceoy/segh' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out trusted scanner configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dceoy/segh
          # pull_request (unlike pull_request_target) runs the workflow
          # version proposed by the pull request itself. For a same-repository
          # pull request, github.workflow_sha can therefore resolve to that
          # proposal, so a pull request that edits this scanner configuration
          # must not be allowed to also supply its own "trusted" checkout.
          # Pin to the pre-pull-request base commit here instead; target
          # repositories keep github.workflow_sha, which always names a
          # dceoy/segh commit unrelated to the repository being scanned.
          ref: ${{ github.repository == 'dceoy/segh' && github.event.pull_request.base.sha || github.workflow_sha }}
          path: _segh
          persist-credentials: false
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge_group has no github.event.pull_request; scan the merge
          # group's own head SHA instead, the synthetic commit the queue is
          # about to merge (which may combine more than one queued pull
          # request), since that is the actual untrusted content in play.
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          path: _target
          persist-credentials: false
      - name: Install checksum-verified scanners
        uses: aquaproj/aqua-installer@a78671ff723534c879a9c8aa62c99a3a05dddb49 # v4.0.5
        with:
          aqua_version: v2.62.1
          working_directory: _segh
      - name: Prepare report directory
        run: mkdir -p security-results
      - name: Run zizmor gate
        working-directory: _target
        run: |
          set +e
          zizmor \
            --offline \
            --no-config \
            --strict-collection \
            --persona regular \
            --min-severity medium \
            --min-confidence high \
            --format json \
            . > "$GITHUB_WORKSPACE/security-results/zizmor.json"
          status=$?
          zizmor \
            --offline \
            --no-config \
            --strict-collection \
            --persona regular \
            --min-severity medium \
            --min-confidence high \
            --no-exit-codes \
            --format plain \
            --color never \
            --render-links never \
            --show-audit-urls always \
            . > "$GITHUB_WORKSPACE/security-results/zizmor.txt" 2>&1
          render_status=$?
          if (( render_status != 0 )); then
            status=$render_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/zizmor.status"
      - name: Run Trivy misconfiguration gate
        if: always()
        working-directory: _target
        run: |
          set +e
          trivy fs \
            --config /dev/null \
            --ignorefile /dev/null \
            --scanners misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.json" \
            --skip-dirs .git \
            --skip-check-update \
            --skip-version-check \
            . 2> "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.log"
          status=$?
          trivy convert \
            --config /dev/null \
            --scanners misconfig \
            --format table \
            --output "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.txt" \
            "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.json"
          convert_status=$?
          if (( status == 0 && convert_status != 0 )); then
            status=$convert_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/trivy-misconfiguration.status"
      - name: Run Trivy vulnerability gate
        if: always()
        working-directory: _target
        run: |
          set +e
          trivy fs \
            --config /dev/null \
            --ignorefile /dev/null \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.json" \
            --skip-dirs .git \
            --skip-version-check \
            . 2> "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.log"
          status=$?
          trivy convert \
            --config /dev/null \
            --scanners vuln \
            --format table \
            --output "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.txt" \
            "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.json"
          convert_status=$?
          if (( status == 0 && convert_status != 0 )); then
            status=$convert_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/trivy-vulnerability.status"
      - name: Run Trivy secret gate
        if: always()
        working-directory: _target
        run: |
          set +e
          trivy fs \
            --config /dev/null \
            --ignorefile /dev/null \
            --secret-config "$GITHUB_WORKSPACE/_segh/.github/security/trivy-secret.yaml" \
            --scanners secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$GITHUB_WORKSPACE/security-results/trivy-secret.json" \
            --skip-dirs .git \
            --skip-version-check \
            . 2> "$GITHUB_WORKSPACE/security-results/trivy-secret.log"
          status=$?
          trivy convert \
            --config /dev/null \
            --scanners secret \
            --format table \
            --output "$GITHUB_WORKSPACE/security-results/trivy-secret.txt" \
            "$GITHUB_WORKSPACE/security-results/trivy-secret.json"
          convert_status=$?
          if (( status == 0 && convert_status != 0 )); then
            status=$convert_status
          fi
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/security-results/trivy-secret.status"
      - name: Publish scanner summary
        if: always()
        run: |
          for scanner in zizmor trivy-misconfiguration trivy-vulnerability trivy-secret; do
            {
              printf '## %s\n\n' "$scanner"
              if [[ -f "security-results/$scanner.txt" ]]; then
                printf '```\n'
                sed -n '1,200p' "security-results/$scanner.txt"
                printf '```\n\n'
              else
                printf 'No human-readable report was produced. See the retained logs.\n\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Retain scanner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-security-reports
          path: security-results
          if-no-files-found: error
          retention-days: 14
      - name: Enforce scanner gates
        if: always()
        run: |
          failed=0
          for scanner in zizmor trivy-misconfiguration trivy-vulnerability trivy-secret; do
            status_file="security-results/$scanner.status"
            if [[ ! -f "$status_file" ]]; then
              echo "::error::$scanner did not produce a status"
              failed=1
              continue
            fi
            status=$(<"$status_file")
            if [[ ! "$status" =~ ^[0-9]+$ ]] || (( status != 0 )); then
              echo "::error::$scanner gate failed with status $status"
              failed=1
            fi
          done
          exit "$failed"

  scorecard:
    # Scorecard is evidence only. Its action has platform limitations for some
    # private repositories, so rulesets must not require this job. Gated to
    # pull_request only so it doesn't double-run now that pull_request_target
    # is also a workflow trigger.
    if: github.repository != 'dceoy/segh' && github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare Scorecard output
        run: mkdir -p security-results
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: security-results/scorecard.json
          results_format: json
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: false
      - name: Retain Scorecard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-security-scorecard
          path: security-results/scorecard.json
          if-no-files-found: warn
          retention-days: 14
