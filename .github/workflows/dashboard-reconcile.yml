---
name: Organization dashboard reconciliation

on:
  workflow_call:
    inputs:
      stale_after_hours:
        description: Maximum age of the last completed scan before a dashboard is stale
        required: false
        type: string
        default: "192"
      scan_result:
        description: Result of the preceding organization scan job
        required: false
        type: string
        default: "unknown"

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      SEGH_DASHBOARD_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require a private dashboard repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != true ]]; then
            echo "::error::Dashboard reconciliation requires a private control repository."
            exit 1
          fi
      - name: Check out trusted reconciler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _trusted
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Download complete App selection
        id: selection
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: organization-selection-snapshot
          path: reconciliation-input/selection
      - name: Download immutable scan plan
        id: plan
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: organization-scan-plan
          path: reconciliation-input/plan
      - name: Download normalized repository summaries
        id: summaries
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repository-summary-*
          path: reconciliation-input/summaries
      - name: Reconcile every repository decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          STALE_AFTER_HOURS: ${{ inputs.stale_after_hours }}
          SCAN_RESULT: ${{ inputs.scan_result }}
          SELECTION_DOWNLOAD_OUTCOME: ${{ steps.selection.outcome }}
          PLAN_DOWNLOAD_OUTCOME: ${{ steps.plan.outcome }}
          SUMMARIES_DOWNLOAD_OUTCOME: ${{ steps.summaries.outcome }}
        with:
          retries: 3
          script: |
            const reconcile = require('./_trusted/scripts/reconcile-organization-dashboard.js');
            await reconcile({
              github,
              context,
              core,
              repositoryPrivate: process.env.REPOSITORY_PRIVATE,
              staleAfterHours: process.env.STALE_AFTER_HOURS,
              scanResult: process.env.SCAN_RESULT,
              selectionPath: 'reconciliation-input/selection/selection.json',
              planPath: 'reconciliation-input/plan/matrix.json',
              summariesPath: 'reconciliation-input/summaries',
              selectionAvailable: process.env.SELECTION_DOWNLOAD_OUTCOME === 'success',
              planAvailable: process.env.PLAN_DOWNLOAD_OUTCOME === 'success',
              summariesAvailable: process.env.SUMMARIES_DOWNLOAD_OUTCOME === 'success',
            });
