---
name: Apply PR 82 CI corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 82 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-issue-78-scanner-hardening
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply observed pinned-tool corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/organization-scan.yml')
          content = path.read_text()
          replacements = [
              (
                  "              printf '#!/bin/sh\\nprintf \"%s\\\\n\" clean > /dev/null\\n' > _target/test.sh",
                  "              cat > _target/test.sh <<'EOF'\n          #!/bin/sh\n          printf '%s\\n' clean > /dev/null\n          EOF",
              ),
              (
                  "            printf 'scorecard: '; scorecard --version",
                  "            printf 'scorecard: '; scorecard version",
              ),
              (
                  '              expect zizmor "$ZIZMOR" failure\n'
                  '              require_file results/zizmor.json\n'
                  '              require_file results/zizmor.log',
                  '              expect zizmor "$ZIZMOR" success\n'
                  '              require_file results/zizmor.json\n'
                  '              require_file results/zizmor.log\n'
                  '              jq -e \'type == "array" and length > 0\' results/zizmor.json > /dev/null',
              ),
          ]
          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}')
              content = content.replace(old, new)
          path.write_text(content)
          PY
          git rm .github/workflows/pr-82-patch.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/organization-scan.yml
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:agent/complete-issue-78-scanner-hardening
