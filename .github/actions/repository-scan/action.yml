---
name: Trusted repository source scanner pipeline
description: Scan a repository checkout as static input and retain identity-bound evidence
inputs:
  artifact-name:
    description: Unique artifact name for the repository scan evidence
    required: false
    default: pr-security-reports
  repository-id:
    description: Immutable GitHub repository database ID
    required: true
  repository:
    description: Repository full name
    required: true
  visibility:
    description: Repository visibility
    required: true
  default-branch:
    description: Repository default branch at planning time
    required: true
  commit-sha:
    description: Exact commit checked out as scanner input
    required: true
runs:
  using: composite
  steps:
    - name: Install checksum-verified scanners
      id: install-scanners
      uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e  # v4.0.5
      with:
        aqua_version: v2.62.1
        working_directory: _segh
    - name: Prepare report directory
      if: always()
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" prepare'
    - name: Validate static target content
      if: always()
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" validate-content'
    - name: Run zizmor gate
      if: always() && steps.install-scanners.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" zizmor'
    - name: Run actionlint and embedded ShellCheck gate
      if: always() && steps.install-scanners.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" actionlint'
    - name: Run standalone ShellCheck gate
      if: always() && steps.install-scanners.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" shellcheck'
    - name: Run Checkov infrastructure-as-code gate
      if: always() && steps.install-scanners.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" checkov'
    - name: Run Trivy vulnerability gate
      if: always() && steps.install-scanners.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" trivy-vulnerability'
    - name: Run Trivy secret gate
      if: always() && steps.install-scanners.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" trivy-secret'
    - name: Record repository and scanner status
      if: always()
      shell: bash
      env:
        SEGH_SCAN_REPOSITORY_ID: ${{ inputs.repository-id }}
        SEGH_SCAN_REPOSITORY: ${{ inputs.repository }}
        SEGH_SCAN_VISIBILITY: ${{ inputs.visibility }}
        SEGH_SCAN_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        SEGH_SCAN_COMMIT_SHA: ${{ inputs.commit-sha }}
      run: '"$GITHUB_ACTION_PATH/scan.sh" status'
    - name: Publish scanner summary
      if: always()
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" summary'
    - name: Retain scanner reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: security-results
        if-no-files-found: error
        retention-days: 14
    - name: Enforce scanner gates
      if: always()
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scan.sh" enforce'
